<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>患者問診の登録</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>患者問診の登録</h1><p>来院前の問診を受け付ける画面です。入力内容は POST /api/patients/intake に送信され、成功すると受付番号を画面に表示します。</p><p>氏名は必須で、40文字までです。未入力のときは「氏名を入力してください」と表示します。</p><p>電話番号は数字のみの10桁または11桁で、ハイフンや文字を含む値は受け付けません。</p><p>送信した問診内容は、画面を再読み込みしても「前回の問診」欄に再表示されます。</p><form method="post" action="/api/patients/intake"><p><label>氏名（必須）<br><input type="text" name="name" required maxlength="40"></label></p><p><label>生年月日<br><input type="date" name="birth" required></label></p><p><label>電話番号<br><input type="text" name="phone" pattern="[0-9]{10,11}" inputmode="numeric"></label></p><p><label>アレルギー（任意）<br><textarea name="allergy" maxlength="200"></textarea></label></p><button type="submit">問診を送信</button></form><h2>前回の問診</h2><div id="last">（保存済みの内容がここに表示されます）</div></body></html>
