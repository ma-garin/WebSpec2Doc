<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文入力 | QAストア会員注文システム</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="logo">QAストア</span>
  <nav>
    <a href="/index.html">トップ</a>
    <a href="/mypage.html">マイページ</a>
    <a href="/products.html">商品一覧</a>
  </nav>
</header>
<main>
  <p class="screen-id">P006</p>
  <h1>注文入力</h1>
  <div class="card">
    <form action="/order_confirm.html" method="get">
      <div class="field">
        <label for="order_name">氏名 <span class="required-mark">必須</span></label>
        <input type="text" id="order_name" name="order_name" maxlength="20" required>
      </div>
      <div class="field">
        <label for="order_kana">フリガナ <span class="required-mark">必須</span></label>
        <input type="text" id="order_kana" name="order_kana" maxlength="40" required>
      </div>
      <div class="field">
        <label for="order_email">メールアドレス <span class="required-mark">必須</span></label>
        <input type="email" id="order_email" name="order_email" maxlength="100" required>
      </div>
      <div class="field">
        <label for="order_tel">電話番号 <span class="hint">半角数字・ハイフンなし</span></label>
        <input type="text" id="order_tel" name="order_tel" maxlength="11">
      </div>
      <div class="field">
        <label for="order_zip">郵便番号 <span class="required-mark">必須</span>
          <span class="hint">ハイフンなし7桁</span></label>
        <input type="text" id="order_zip" name="order_zip" maxlength="8" required>
      </div>
      <div class="field">
        <label for="order_address">住所 <span class="required-mark">必須</span></label>
        <input type="text" id="order_address" name="order_address" maxlength="120" required>
      </div>
      <div class="field">
        <label for="order_qty">数量 <span class="required-mark">必須</span>
          <span class="hint">1〜99</span></label>
        <input type="number" id="order_qty" name="order_qty" min="1" max="99" value="1" required>
      </div>
      <div class="field">
        <label for="payment_method">支払方法 <span class="required-mark">必須</span></label>
        <select id="payment_method" name="payment_method" required>
          <option value="">選択してください</option>
          <option value="credit">クレジットカード</option>
          <option value="bank">銀行振込</option>
          <option value="cod">代金引換</option>
        </select>
      </div>
      <div class="field">
        <label for="order_note">備考 <span class="hint">200文字以内</span></label>
        <textarea id="order_note" name="order_note" rows="3" maxlength="200"></textarea>
      </div>
      <button type="submit">確認画面へ</button>
      <a class="btn secondary" href="/products.html">キャンセル</a>
    </form>
  </div>
</main>
<footer>QAストア（AutoRun動作検証用ダミーサイト）</footer>
</body>
</html>
