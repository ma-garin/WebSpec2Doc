{#- 状態: forbidden。親に class="ui-state-root" data-state="..." を付け、その直下に include する。文言は UIStates.set の opts で上書きする。 -#}
<section class="ui-state-pane" data-pane="forbidden" role="alert">
  <p class="ui-state-title">{{ state_title|default('この操作の権限がありません') }}</p>
  <p class="ui-state-message">{{ state_message|default('いまの役割ではこの画面を操作できません。') }}</p>
  <p class="ui-state-next">{{ state_next|default('管理者に役割の付与を依頼してください。') }}</p>
</section>
