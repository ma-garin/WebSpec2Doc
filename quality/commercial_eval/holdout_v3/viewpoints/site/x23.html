<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設備点検の記録</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>設備点検の記録</h1><p>工場の設備点検結果を記録します。点検日、温度、判定は必須です。温度は-20.0〜120.0℃の範囲で入力します。</p><p>判定が「不合格」のときは備考の入力が必須です。</p><p>「記録」で POST /api/inspections に送信します。通信に失敗した場合は入力内容を端末に下書きとして残し、画面を再読み込みしても下書きが復元されます。「再送信」ボタンでもう一度送れます。失敗時は「送信できませんでした」と表示します。</p><form method="post" action="/api/inspections"><p><label>点検日<br><input type="date" name="d" required></label></p><p><label>温度（℃）<br><input type="number" name="temp" required min="-20" max="120" step="0.1"></label></p><p>判定（必須）<br><label><input type="radio" name="res" value="ok" required> 合格</label> <label><input type="radio" name="res" value="ng"> 不合格</label></p><p><label>備考（不合格のとき必須）<br><textarea name="memo"></textarea></label></p><button type="submit">記録</button> <button type="button">再送信</button></form></body></html>
