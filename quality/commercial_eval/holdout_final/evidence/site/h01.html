<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>自動車保険 お見積もり | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>自動車保険 お見積もり</h1>
<button type="button">見積もる</button>
<h2>ご契約者の情報</h2>
<form id="q" action="h02.html" method="post">
<div id="q-err" aria-live="polite"></div>
<input type="hidden" name="quote_token" value="tok-7781">
<div class="row"><label for="f1">生年月日</label><input type="date" id="f1" name="birth" required min="1940-01-01" max="2008-12-31"></div>
<div class="row"><label for="f2">運転歴(年)</label><input type="number" id="f2" name="years" required min="0" max="60"></div>
<div class="row"><label for="f3">車種</label><select id="f3" name="car" required><option value="">選択してください</option><option value="k">軽自動車</option><option value="s">小型乗用車</option><option value="l">普通乗用車</option></select></div>
<h2>免許証の色</h2>
<fieldset><legend>免許証の色</legend><div class="row"><input type="radio" id="license-1" name="license" value="g"><label for="license-1">ゴールド</label></div><div class="row"><input type="radio" id="license-2" name="license" value="b"><label for="license-2">ブルー</label></div><div class="row"><input type="radio" id="license-3" name="license" value="gr"><label for="license-3">グリーン</label></div></fieldset>
<h2>特約</h2>
<fieldset><legend>特約</legend><div class="row"><input type="checkbox" id="rider-1" name="rider" value="law"><label for="rider-1">弁護士費用特約</label></div><div class="row"><input type="checkbox" id="rider-2" name="rider" value="road"><label for="rider-2">ロードサービス</label></div><div class="row"><input type="checkbox" id="rider-3" name="rider" value="new"><label for="rider-3">車両新価特約</label></div></fieldset>
<div class="row"><label for="f10">メールアドレス</label><input type="email" id="f10" name="email" required maxlength="80"></div>
<div class="row"><label for="f11">備考</label><textarea id="f11" name="remarks" maxlength="300" rows="4"></textarea></div>
<div style="display:none"><h2>法人契約のお客様</h2><label>法人番号<input name="corp_no"></label><button type="button">法人割引を適用</button></div>
<div hidden><p class="error">運転歴は60年以内で入力してください</p></div>
<input type="submit" value="見積もる">
<input type="button" value="入力をクリア">
</form>
<p><a href="h02.html">契約者情報を変更する</a> / <a href="https://example.com/terms">約款を確認する</a></p>
<script>(function(){var f=document.getElementById("q");var box=document.getElementById("q-err");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(f.elements["birth"].value===''){errs.push("生年月日を入力してください");}if(f.elements["years"].value===''){errs.push("運転歴を入力してください");}if(f.elements["car"].value===''){errs.push("車種を選択してください");}if(f.elements["email"].value.indexOf('@')<0){errs.push("メールアドレスの形式が正しくありません");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/quotes",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("x");}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="見積もりに失敗しました。時間をおいて再度お試しください";box.appendChild(q);});}});})();</script>
</main>
</body></html>
