<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>在庫一覧 | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>在庫一覧</h1>
<h2>絞り込み</h2>
<div class="row"><label for="warehouse">倉庫</label><select id="warehouse" name="warehouse"><option value="">すべて</option><option value="tokyo">東京倉庫</option><option value="osaka">大阪倉庫</option></select></div>
<div class="row"><label for="sku">SKU</label><input type="text" id="sku" name="sku" maxlength="8" pattern="^[A-Z]{3}-\d{4}$"></div>
<span class="field-error" id="sku-err" aria-live="polite"></span>
<div class="row"><label for="min_qty">最小在庫数</label><input type="number" id="min_qty" name="min_qty" min="0"></div>
<button type="button">検索</button>
<h2>現在庫</h2>
<table><thead><tr><th>SKU</th><th>商品名</th><th>在庫数</th></tr></thead><tbody><tr><td>MOU-0001</td><td>ワイヤレスマウス M-200</td><td>120</td></tr><tr><td>HUB-0002</td><td>USBハブ 4ポート</td><td>45</td></tr><tr><td>STD-0003</td><td>ノートPCスタンド</td><td>8</td></tr></tbody></table>
<h2>在庫履歴</h2>
<table><thead><tr><th>日時</th><th>SKU</th><th>増減</th></tr></thead><tbody id="history"></tbody></table>
<div hidden><h3>原価一覧</h3><table><thead><tr><th>仕入先</th><th>原価</th></tr></thead><tbody><tr><td>仕入先A</td><td>1,200円</td></tr></tbody></table></div>
<a href="p10.html">ダッシュボードへ</a>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script src="js/p15.js"></script>
</body></html>
