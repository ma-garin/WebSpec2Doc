        <!-- ===== テスト活動支援 / 詳細設計 ===== -->
        <!-- 工程再定義でこの器は「テスト詳細設計」になった。ルート id は JS とナビが参照するため据え置く。 -->
        <section class="view" id="view-test-strategy">
          <div class="dashboard-section-head">
            <div>
              <h2 class="dash-section-title">テスト詳細設計</h2>
              <p class="dashboard-section-copy">テスト条件を技法で展開し、テストケースの骨子を作ります。</p>
            </div>
            <div class="dashboard-section-actions">
              <button type="button" class="btn-outline-sm" id="ta-detail-reset">計画の既定に戻す</button>
            </div>
          </div>

          <div class="ta-panel">
            <div class="ta-panel-head">
              <div>
                <div class="ta-panel-title">適用する技法</div>
                <div class="ta-panel-sub">テスト計画で決めた技法が既定で有効になります。</div>
              </div>
            </div>
            <div class="ta-panel-body">
              <!-- 有効な技法は計画側の選択から決まるため、静的なチップを置かず JS の描画に一本化する。 -->
              <div class="ta-chips" id="ta-detail-techniques"></div>
            </div>
          </div>

          <div class="ta-panel">
            <div class="ta-panel-head">
              <div>
                <div class="ta-panel-title">デシジョンテーブル</div>
                <div class="ta-panel-sub">条件の組合せと期待動作。列がそのままケース骨子になります。</div>
              </div>
              <div class="ta-panel-actions">
                <button type="button" class="btn-outline-sm" id="ta-detail-condition-add">条件を追加</button>
              </div>
            </div>
            <div class="ta-panel-body">
              <div class="ta-table-wrap">
                <table class="ta-table">
                  <thead>
                    <tr>
                      <th>条件</th>
                      <th>R1</th>
                      <th>R2</th>
                      <th>R3</th>
                      <th>R4</th>
                    </tr>
                  </thead>
                  <tbody id="ta-detail-dt-body">
                    <tr>
                      <td colspan="5"><div class="empty">まだデータがありません</div></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="ta-panel">
            <div class="ta-panel-head">
              <div>
                <div class="ta-panel-title">展開結果（ケース骨子）</div>
                <div class="ta-panel-sub">条件×技法ごとの展開数。テストケース実装工程で実行粒度に仕上げます。</div>
              </div>
              <div class="ta-panel-actions">
                <button type="button" class="btn-primary" id="ta-detail-expand">技法で展開（骨子に追加）</button>
              </div>
            </div>
            <div class="ta-panel-body">
              <div class="ta-table-wrap">
                <table class="ta-table">
                  <thead>
                    <tr>
                      <th>条件ID</th>
                      <th>技法</th>
                      <th class="num">骨子数</th>
                      <th>状態</th>
                    </tr>
                  </thead>
                  <tbody id="ta-detail-expansion-body">
                    <tr>
                      <td colspan="4"><div class="empty">まだデータがありません</div></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <p class="ta-note">生成系の操作はすべて既存への追加です。上書きが必要な場合は確認をはさみます。</p>
        </section>
