<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>申請ステータス | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>申請ステータス</h1>
<section class="spec"><h2>画面の説明</h2><ul><li>申請の状態は「下書き」→「申請中」→「承認済み」または「差戻し」と遷移する。</li><li>「下書き」でだけ「申請する」を押せる。「申請中」でだけ「取り下げ」を押せる。</li><li>「差戻し」の申請は「再申請」で「申請中」に戻る。</li><li>遷移できない状態で操作した場合は「この状態ではできません」と表示する。</li></ul></section>
<section><h2>画面</h2>
<p>現在の状態: <strong>下書き</strong></p><button type="button">申請する</button><button type="button">取り下げ</button><button type="button">再申請</button><p id="msg"></p>
</section>
</main>
</body></html>
