<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ログイン | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>ログイン</h1>
<p class="error" role="alert">セッションの有効期限が切れました。再度ログインしてください。</p>
<div hidden><h2>管理者ログイン</h2></div>
<form id="login" action="#" method="post" novalidate>
<div class="row"><input type="text" id="login_id" name="login_id" required maxlength="30" aria-label="ログインID"></div>
<div class="row"><input type="password" id="pw" name="pw" required minlength="8" aria-label="パスワード"></div>
<div class="row"><input type="checkbox" id="remember" name="remember"><label for="remember">ログイン状態を保持する</label></div>
<div style="display:none"><button type="button">パスワードをお忘れの方</button></div>
<div id="login-errors" aria-live="polite"></div>
<input type="submit" value="ログイン">
</form>
<button type="button">ログイン</button>
<a href="p01.html">新規会員登録</a>
<a href="p22.html">会員ページへ</a>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script>
(function(){var f=document.getElementById("login");var box=document.getElementById("login-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(f.elements["login_id"].value===''){errs.push("ログインIDを入力してください");}if(f.elements["pw"].value===''){errs.push("パスワードを入力してください");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/auth/login",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="ログインに失敗しました";box.appendChild(q);});}});})();
</script>
</body></html>
