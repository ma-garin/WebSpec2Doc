<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ログイン | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>ログイン</h1>
<section class="spec"><h2>画面の説明</h2><ul><li>ログインIDとパスワードは必須。</li><li>認証に失敗すると「IDまたはパスワードが違います」と表示する。</li><li>連続 5 回失敗するとアカウントは「ロック中」の状態になり、30 分間ログインできない。</li><li>認証は /api/login に POST する。</li></ul></section>
<section><h2>画面</h2>
<form><label for="i">ログインID</label><input id="i" name="login_id" required><label for="p">パスワード</label><input type="password" id="p" name="pw" required><button type="button" id="go">ログイン</button></form><p id="msg"></p>
</section>
<script>(function(){var b=document.getElementById("go");if(!b){return;}b.addEventListener("click",function(){fetch("/api/login",{method:"POST"}).then(function(r){if(!r.ok){throw new Error("x");}return r.json();}).catch(function(){document.getElementById("msg").textContent="IDまたはパスワードが違います";});});})();</script>
</main>
</body></html>
