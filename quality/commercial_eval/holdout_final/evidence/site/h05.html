<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>課題の提出 | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>課題の提出</h1>
<p class="error" role="alert">前回の提出は期限を過ぎていたため受理されませんでした</p>
<form id="sub" action="h05.html" method="post" enctype="multipart/form-data">
<input type="hidden" name="course_id" value="101">
<div id="sub-err"></div>
<div class="row"><label for="f1">課題番号</label><select id="f1" name="task" required><option value="">選択してください</option><option value="1">課題1</option><option value="2">課題2</option><option value="3">課題3</option></select></div>
<div class="row"><label for="f2">提出ファイル</label><input type="file" id="f2" name="attachment" required></div>
<fieldset><legend>提出物の形式</legend><div class="row"><input type="radio" id="format-1" name="format" value="pdf"><label for="format-1">PDF</label></div><div class="row"><input type="radio" id="format-2" name="format" value="doc"><label for="format-2">Word</label></div><div class="row"><input type="radio" id="format-3" name="format" value="etc"><label for="format-3">その他</label></div></fieldset>
<div class="row"><label for="f6">コメント</label><textarea id="f6" name="comment" maxlength="500" rows="5"></textarea></div>
<div class="row"><input type="checkbox" id="f7" name="selfcheck" required><label for="f7">自己点検を済ませた</label></div>
<div aria-hidden="true" style="display:none"><h2>採点者向けの設定</h2><p>採点者向けメモ</p><button type="button">採点を確定</button></div>
<input type="submit" value="提出する">
<button type="button">下書き保存</button>
</form>
<script>(function(){var f=document.getElementById("sub");var box=document.getElementById("sub-err");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(f.elements["task"].value===''){errs.push("課題を選択してください");}if(f.elements["attachment"].value===''){errs.push("ファイルを選択してください");}if(!f.elements["selfcheck"].checked){errs.push("自己点検にチェックしてください");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/submissions",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("x");}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="提出に失敗しました";box.appendChild(q);});}});})();</script>
</main>
</body></html>
