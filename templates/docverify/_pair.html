{# 対検査レビュー（要件定義書 ⇔ 基本設計書）。状態は data-state を docverify-pair.js が API 応答で切り替える #}
<section class="dv-view dvp" data-view="pair" data-state="loading" hidden aria-labelledby="dvp-title">
  <div class="p1-head">
    <h2 id="dvp-title" class="dvp-title">対検査（要件定義書 ⇔ 基本設計書）</h2>
    <span class="p1-ver" data-pair-ver></span>
    <span class="sp"></span>
    <span class="dvp-msg" role="status" aria-live="polite" data-pair-msg></span>
    <button type="button" class="p1-btn" data-dv-report>指摘書を出力</button>
    <button type="button" class="p1-btn" data-pair-act="reload">再読み込み</button>
  </div>
  <div class="p1-notice" role="alert" data-pair-notice>
    <span data-pair-notice-msg></span>
    <button type="button" class="p1-btn" data-pair-act="retry">もう一度保存</button>
    <button type="button" class="p1-btn" data-pair-act="reload">最新を読み込む</button>
  </div>
  <div class="p1-pair">
    <article class="p1-doc" aria-label="要件定義書">
      <header class="p1-doc-t">要件定義書 <span class="p1-doc-v" data-ver="req"></span></header>
      <div class="p1-doc-s" data-doc="req" tabindex="0"></div>
    </article>
    <article class="p1-doc" aria-label="基本設計書">
      <header class="p1-doc-t">基本設計書 <span class="p1-doc-v" data-ver="design"></span></header>
      <div class="p1-doc-s" data-doc="design" tabindex="0"></div>
    </article>
    <aside class="p1-side" aria-label="指摘と証跡">
      <div class="p3-tabs" role="tablist">
        <button type="button" role="tab" class="p3-tab" data-tab="findings" aria-selected="true">指摘 <span class="dvp-n" data-n="tab"></span></button>
        <button type="button" role="tab" class="p3-tab" data-tab="trail" aria-selected="false">証跡</button>
      </div>
      <div class="p3-pane" data-pane="findings" role="tabpanel">
        <div class="p1-filter" role="group" aria-label="指摘の絞り込み">
          <button type="button" class="p3-chip" data-filter="all" aria-pressed="true">全件 <span data-n="all"></span></button>
          <button type="button" class="p3-chip" data-filter="changed" aria-pressed="false">今回の変更分 <span data-n="changed"></span></button>
          <button type="button" class="p3-chip" data-filter="review" aria-pressed="false">要確認 <span data-n="review"></span></button>
          <button type="button" class="p3-chip" data-filter="critical" aria-pressed="false">重大 <span data-n="critical"></span></button>
        </div>
        <div class="p1-list" data-pair-list></div>
      </div>
      <div class="p3-pane" data-pane="trail" role="tabpanel" hidden>
        <div class="p3-gbox">
          <div class="p3-sec-t">承認</div>
          <p class="dvp-hint" data-pair-approve-hint></p>
          <label class="dvp-lbl" for="dvp-approve-reason">承認の理由</label>
          <textarea id="dvp-approve-reason" class="dvp-reason" rows="2" maxlength="500" placeholder="例: 重大な指摘はすべて解消済み。要確認はありません。"></textarea>
          <div class="dvp-row"><span class="dvp-err" role="alert" data-pair-approve-err></span><button type="button" class="p1-btn is-primary" data-pair-act="approve" disabled>承認する</button></div>
        </div>
        <div class="p3-sec-t">証跡（新しい順）</div>
        <ol class="p1-log" data-pair-trail></ol>
      </div>
    </aside>
    <div class="p1-statebox" data-pair-statebox>
      <div class="p1-skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="dvp-state-msg" data-pair-state-msg>対検査の内容を読み込んでいます。</p>
      <button type="button" class="p1-btn" data-pair-act="reload">もう一度読み込む</button>
    </div>
  </div>
  <div class="p1-gate" aria-label="判定">
    <div class="p5-gates" data-pair-gates></div>
    <p class="p5-why" data-pair-why></p>
    <button type="button" class="p1-btn is-primary" data-pair-act="to-approve">承認へ</button>
  </div>
</section>
