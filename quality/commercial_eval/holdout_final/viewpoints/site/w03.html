<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>保険料シミュレーション | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>保険料シミュレーション</h1>
<section class="spec"><h2>画面の説明</h2><ul><li>年齢は 18 歳から 80 歳までの整数で入力する(必須)。</li><li>保険金額は 500万円・1000万円・3000万円から選ぶ(必須)。</li><li>数字以外を入力した場合は「年齢は半角数字で入力してください」と表示する。</li><li>「計算する」で /api/premium に POST し、月額保険料を画面に表示する。</li><li>通信に失敗した場合は「計算できませんでした」と表示する。</li></ul></section>
<section><h2>画面</h2>
<form><label for="age">年齢</label><input type="number" id="age" name="age" min="18" max="80" required><label for="amt">保険金額</label><select id="amt" name="amt" required><option value="">選択してください</option><option>500万円</option><option>1000万円</option><option>3000万円</option></select><button type="button" id="go">計算する</button></form><p id="msg"></p>
</section>
<script>(function(){var b=document.getElementById("go");if(!b){return;}b.addEventListener("click",function(){fetch("/api/premium",{method:"POST"}).then(function(r){if(!r.ok){throw new Error("x");}return r.json();}).catch(function(){document.getElementById("msg").textContent="計算できませんでした";});});})();</script>
</main>
</body></html>
