<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サポートチケットの状態管理</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>サポートチケットの状態管理</h1><p>チケットの状態は「新規」→「対応中」→「保留」→「解決」→「クローズ」と進みます。状態に応じて押せるボタンが変わり、クローズしたチケットは再オープンできません。</p><p>状態を変えられるのは担当者ロールのみです。閲覧者ロールのボタンは無効になります。</p><p>ボタンを押すと PATCH /api/tickets/{id}/status に送信します。更新に失敗したときは「更新できませんでした」とバナーで表示し、状態は元のままです。</p><p>現在の状態: <strong>新規</strong></p><button type="button">対応を開始</button> <button type="button">保留にする</button> <button type="button">解決にする</button> <button type="button">クローズ</button></body></html>
