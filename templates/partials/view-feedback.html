        <!-- ===== フィードバックビュー ===== -->
        <section class="view" id="view-feedback">
          <div class="input-card">
            <div class="wizard-page-header">
              <h2>フィードバックを送る</h2>
              <p>お気づきの点をお知らせください。再現手順や期待した動作があると助かります。</p>
            </div>

            <form id="feedback-form" novalidate>
              <fieldset class="feedback-field">
                <legend class="feedback-label">種類</legend>
                <div class="feedback-radios">
                  <label class="feedback-radio">
                    <input type="radio" name="feedback-category" value="bug" checked>
                    <span>不具合</span>
                  </label>
                  <label class="feedback-radio">
                    <input type="radio" name="feedback-category" value="request">
                    <span>要望</span>
                  </label>
                  <label class="feedback-radio">
                    <input type="radio" name="feedback-category" value="other">
                    <span>その他</span>
                  </label>
                </div>
              </fieldset>

              <div class="feedback-field">
                <label class="feedback-label" for="feedback-message">内容</label>
                <textarea id="feedback-message" class="feedback-textarea" rows="8" maxlength="4000"
                          placeholder="例）画面/操作: レポート → テスト実行タブ&#10;手順: 1) ケースを選ぶ 2) 実行ボタンを押す&#10;期待した動作: 実行結果が一覧に表示される&#10;実際の動作: ボタンを押しても反応がない"></textarea>
                <div class="feedback-counter"><span id="feedback-count">0</span> / 4000</div>
                <p class="input-hint">発生画面・操作手順・期待した動作と実際の動作を書くと調査が早くなります。</p>
              </div>

              <div class="feedback-meta">
                <div><span class="feedback-meta-key">送信者</span><span id="feedback-meta-user">-</span></div>
                <div><span class="feedback-meta-key">直前の画面</span><span id="feedback-meta-view">-</span></div>
              </div>

              <p id="feedback-status" class="feedback-status" role="status" aria-live="polite" hidden></p>

              <div class="feedback-actions">
                <button type="button" id="feedback-clear-btn" class="btn-outline-sm account-submit">クリア</button>
                <button type="submit" id="feedback-submit-btn" class="btn-primary account-submit">送信</button>
              </div>
            </form>
          </div>
        </section>
