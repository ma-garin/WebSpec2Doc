<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン | QAストア会員注文システム</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="logo">QAストア</span>
  <nav>
    <a href="/index.html">トップ</a>
    <a href="/products.html">商品一覧</a>
  </nav>
</header>
<main>
  <p class="screen-id">P002</p>
  <h1>ログイン</h1>
  <div class="card">
    <form action="/mypage.html" method="get">
      <div class="field">
        <label for="login_id">メールアドレス <span class="required-mark">必須</span>
          <span class="hint">100文字以内</span></label>
        <input type="email" id="login_id" name="login_id" maxlength="100" required>
      </div>
      <div class="field">
        <label for="password">パスワード <span class="required-mark">必須</span>
          <span class="hint">8〜32文字</span></label>
        <input type="password" id="password" name="password" minlength="8" maxlength="32" required>
      </div>
      <button type="submit">ログイン</button>
      <a class="btn secondary" href="/index.html">戻る</a>
    </form>
  </div>
</main>
<footer>QAストア（AutoRun動作検証用ダミーサイト）</footer>
</body>
</html>
