        <!-- ===== 実行履歴ビュー（種別を問わない一般化・R2-27） ===== -->
        <section class="view" id="view-run-history">
          <div class="rh-toolbar">
            <div class="rh-type-tabs" role="tablist" aria-label="履歴の種別">
              <!-- 他のタブは機能名なのに、ここだけ動詞（解析）だった。
                   AutoRun 側は「解析」に統一したため、動詞のままだと
                   同じ行為を2語で呼ぶことになる。システム名に揃える。 -->
              <button type="button" class="rh-type-tab" data-type="crawl" data-system="docs" role="tab">ドキュメント作成</button>
              <button type="button" class="rh-type-tab" data-type="autorun" data-system="autorun" role="tab">AutoRun</button>
              <button type="button" class="rh-type-tab" data-type="comparison" data-system="docs" role="tab">現新比較</button>
              <button type="button" class="rh-type-tab" data-type="ux_review" data-system="docs" role="tab">UXレビュー</button>
              <button type="button" class="rh-type-tab" data-type="schedule" data-system="docs" role="tab">スケジュール</button>
              <button type="button" class="rh-type-tab" data-type="all" role="tab">すべて</button>
            </div>
            <button type="button" id="rh-reload-btn" class="btn-outline-sm">↺ 再読み込み</button>
          </div>

          <div id="rh-container">
            <table class="rh-table">
              <thead>
                <tr>
                  <th>種別</th>
                  <th>サイト</th>
                  <th>日時</th>
                  <th>状態</th>
                  <th>段階承認</th>
                      <th>主要数値</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="rh-tbody"></tbody>
            </table>
            <div id="rh-empty" style="display:none">実行履歴がありません。</div>
            <div id="rh-pager" class="pager-wrap"></div>
          </div>
        </section>
