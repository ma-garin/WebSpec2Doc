<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>振込の入力</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>振込の入力</h1><p>画面内の流れは「入力」→「確認」→「完了」です。確認の段階では入力欄が編集できなくなり、「戻る」で入力に戻せます。完了後は同じ内容を再送信できません。</p><p>口座番号は数字7桁、金額は1円〜1,000,000円で、どちらも必須です。数字以外や桁違いの口座番号は拒否します。</p><p>完了時に POST /api/transfers に送信します。残高が足りない場合は「残高が不足しています」と表示します。応答が30秒を超えると「通信がタイムアウトしました」と表示し、「再試行」で再送できます。同一内容の二重送信は重複として拒否します。</p><form method="post" action="/api/transfers"><p><label>口座番号<br><input type="text" name="acct" required pattern="[0-9]{7}"></label></p><p><label>金額（円）<br><input type="number" name="amount" required min="1" max="1000000"></label></p><button type="button">確認へ</button> <button type="button">戻る</button> <button type="submit">振込を実行</button> <button type="button">再試行</button></form></body></html>
