<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ご利用アンケート | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>ご利用アンケート</h1>
<form id="survey" action="#" method="post" novalidate>
<h2>満足度</h2>
<div class="row"><input type="radio" id="sat-5" name="sat" value="5"><label for="sat-5">とても満足</label></div>
<div class="row"><input type="radio" id="sat-4" name="sat" value="4"><label for="sat-4">満足</label></div>
<div class="row"><input type="radio" id="sat-3" name="sat" value="3"><label for="sat-3">どちらでもない</label></div>
<div class="row"><input type="radio" id="sat-2" name="sat" value="2"><label for="sat-2">不満</label></div>
<div class="row"><input type="radio" id="sat-1" name="sat" value="1"><label for="sat-1">とても不満</label></div>
<h2>ご利用の理由</h2>
<div class="row"><label><input type="checkbox" id="reason_price" name="reason_price"> 価格</label></div>
<div class="row"><label><input type="checkbox" id="reason_speed" name="reason_speed"> 配送の速さ</label></div>
<div class="row"><label><input type="checkbox" id="reason_support" name="reason_support"> サポート</label></div>
<div class="row"><select id="age" name="age" aria-label="年代"><option value="">選択</option><option value="20">20代</option><option value="30">30代</option><option value="40">40代</option></select></div>
<div class="row"><label for="visits">月間の利用回数</label><input type="number" id="visits" name="visits" min="0" max="31"></div>
<div class="row"><label for="email">メールアドレス（任意）</label><input type="email" id="email" name="email" maxlength="100"></div>
<div class="row"><textarea id="comment" name="comment" rows="4"></textarea></div>
<div id="survey-errors" aria-live="polite"></div>
<input type="submit" value="回答を送信">
</form>
<div id="dyn13" class="dyn"></div>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script>
(function(){var f=document.getElementById("survey");var box=document.getElementById("survey-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(!f.querySelector('input[name="sat"]:checked')){errs.push("満足度を選択してください");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/surveys",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="回答を送信できませんでした";box.appendChild(q);});}});})();
document.addEventListener("DOMContentLoaded",function(){var c=document.getElementById("dyn13");var h3=document.createElement("h3");h3.textContent="所要時間：約2分";c.appendChild(h3);});
</script>
</body></html>
