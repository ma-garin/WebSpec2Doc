<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>権限がありません</title>
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
<style>
  body { margin: 0; background: var(--color-bg, #f5f6f8); color: var(--color-text, #1c2430); font-family: system-ui, "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
  .card { background: var(--color-surface, #fff); border: 1px solid var(--color-border, #d9dee5); border-radius: 8px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 8px 0; line-height: 1.7; color: var(--color-text-secondary, #4a5565); }
  a.btn { display: inline-block; margin-top: 12px; padding: 8px 16px; border-radius: 6px; background: var(--color-primary, #2563eb); color: #fff; text-decoration: none; font-weight: 700; }
  a.btn:focus-visible { outline: 2px solid var(--color-primary, #2563eb); outline-offset: 2px; }
</style>
</head>
<body>
<main role="main">
  <div class="card">
    <h1>この画面は管理者だけが使えます</h1>
    <p>この画面（ワークスペース・テスト自動化）には、対象サイトへ実際に操作を送る機能が含まれるため、管理者に限っています。一般ユーザーは開けません。</p>
    <p>使いたいときは、管理者に権限の付与を依頼してください。ドキュメント作成のダッシュボードや AutoRun など、ほかの画面は引き続き使えます。</p>
    <a class="btn" href="/systems">システム選択へ戻る</a>
  </div>
</main>
</body>
</html>
