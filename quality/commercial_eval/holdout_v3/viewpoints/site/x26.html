<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>授業アンケート</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>授業アンケート</h1><p>授業の満足度を1〜5から選ぶアンケートです。満足度とコメントはどちらも任意です。コメントは200文字までです。</p><p>「送信」を押すと画面に「ありがとうございました」と表示するだけで、サーバーへの送信先は設けていません。</p><form onsubmit="return false"><p>満足度<br><label><input type="radio" name="s" value="1">1</label> <label><input type="radio" name="s" value="3">3</label> <label><input type="radio" name="s" value="5">5</label></p><p><label>コメント<br><textarea maxlength="200"></textarea></label></p><button type="submit">送信</button></form></body></html>
