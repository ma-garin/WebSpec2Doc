<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申請の承認一覧</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>申請の承認一覧</h1><p>提出された申請の一覧です。各申請の状態は「申請中」から「承認」または「却下」に変わります。承認・却下済みの申請は再度変更できません。</p><p>承認と却下のボタンは職員ロールのみ使えます。申請者ロールは自分の申請を閲覧するだけで、ボタンは表示されません。</p><p>承認待ちの申請が1件も無いときは「承認待ちの申請はありません」と表示します。</p><table><tr><th>申請番号</th><th>状態</th><th>操作</th></tr><tr><td>A-001</td><td>申請中</td><td><button type="button">承認</button> <button type="button">却下</button></td></tr></table><p>承認待ちの申請はありません（0件時）</p></body></html>
