        <!-- ===== テスト活動支援 / 実行 ===== -->
        <section class="view" id="view-test-execution">
          <div class="dashboard-section-head">
            <div>
              <p class="dashboard-section-copy">実装した自動テストを環境ごとに実行し、結果と証跡を収集します。</p>
            </div>
            <div class="dashboard-section-actions">
              <button type="button" class="ta-linkbtn" id="ta-exec-reload">再読み込み</button>
            </div>
          </div>

          <div class="ta-panel">
            <div class="ta-panel-body">
              <div class="ta-exec-bar" style="display:flex;align-items:center;flex-wrap:wrap;gap:14px;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <label for="ta-exec-suite" class="ta-kv-key">実行対象</label>
                  <select class="select-compact" id="ta-exec-suite" style="width:220px;">
                    <option value="">テストスイートを選択</option>
                  </select>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <label for="ta-exec-env" class="ta-kv-key">環境</label>
                  <select class="select-compact" id="ta-exec-env" style="width:140px;">
                    <option value="local">ローカル</option>
                    <option value="staging">ステージング</option>
                    <option value="production">本番</option>
                  </select>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <label for="ta-exec-parallel" class="ta-kv-key">並列度</label>
                  <input type="number" class="input-compact" id="ta-exec-parallel" min="1" max="16" step="1" placeholder="1" value="1" style="width:64px;" />
                </div>
                <span class="ta2-badge ta2-badge-info" id="ta-exec-run-badge" style="display:none">実行中 <span id="ta-exec-run-progress"></span></span>
                <div style="flex:1 1 auto;min-width:8px;"></div>
                <button type="button" class="ta-linkbtn" id="ta-exec-schedule" disabled data-wip="1">スケジュール登録</button>
                <span class="ta-wip-note">準備中</span>
                <button type="button" class="btn-danger-outline" id="ta-exec-stop" title="実行を停止します" style="display:none;">実行を停止</button>
                <button type="button" class="btn-primary" id="ta-exec-run" disabled title="実行対象を選択してください">実行</button>
              </div>
            </div>
          </div>

          <div class="ta-panel">
            <div class="ta-panel-body">
              <div class="autorun-progressbar" id="ta-exec-gauge" style="display:flex;height:10px;" role="img" aria-label="成功・失敗・未実行の比率">
                <div id="ta-exec-gauge-ok" style="height:100%;width:0%;background:var(--d-ok-text);"></div>
                <div id="ta-exec-gauge-ng" style="height:100%;width:0%;background:var(--d-ng-text);"></div>
                <div id="ta-exec-gauge-wait" style="height:100%;width:0%;background:#D1D5DB;"></div>
              </div>
              <div style="margin-top:10px;">
                <span class="ta2-badge ta2-badge-ok" id="ta-exec-legend-ok">成功 —</span>
                <span class="ta2-badge ta2-badge-ng" id="ta-exec-legend-ng">失敗 —</span>
                <span class="ta2-badge ta2-badge-muted" id="ta-exec-legend-wait">未実行 —</span>
              </div>
            </div>
          </div>

          <div class="ta-grid-3">
            <div class="stat-card" style="order:2">
              <div class="stat-card-value is-pri" id="ta-exec-stat-total">-</div>
              <div class="stat-card-label">実行数</div>
            </div>
            <div class="stat-card" style="order:1">
              <div class="stat-card-value" id="ta-exec-stat-rate">-</div>
              <div class="stat-card-label">成功率</div>
            </div>
            <div class="stat-card" style="order:0">
              <div class="stat-card-value is-ng" id="ta-exec-stat-failed">-</div>
              <div class="stat-card-label">失敗数</div>
            </div>
          </div>

          <div class="ta-panel">
            <div class="ta-panel-head">
              <div>
                <div class="ta-panel-title">実行結果</div>
                <div class="ta-panel-sub">失敗を上に固定して表示します。所要時間・失敗ステップ・証跡を確認します。</div>
              </div>
              <div class="ta-panel-actions">
                <span class="muted-copy" id="ta-exec-shown-count"></span>
                <button type="button" class="ta-linkbtn" id="ta-exec-export">結果を書き出す</button>
                <span class="ta2-badge" id="ta-exec-export-status" style="display:none"></span>
              </div>
            </div>
            <div class="ta-panel-body">
              <div class="ta-table-wrap">
                <table class="ta-table">
                  <thead>
                    <tr>
                      <th scope="col">ケースID</th>
                      <th scope="col">結果</th>
                      <th scope="col">所要</th>
                      <th scope="col">失敗ステップ</th>
                      <th scope="col">証跡</th>
                    </tr>
                  </thead>
                  <tbody id="ta-exec-result-body">
                    <tr>
                      <td colspan="5"><div class="empty">読み込んでいます…</div></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="ta-panel">
            <div class="ta-panel-head">
              <div>
                <div class="ta-panel-title">実行ログ</div>
                <div class="ta-panel-sub">実行中の標準出力とエラーをそのまま表示します（常時表示・折りたたみません）。</div>
              </div>
              <div class="ta-panel-actions">
                <button type="button" class="ta-linkbtn" id="ta-exec-log-clear">ログをクリア</button>
                <span class="ta2-badge" id="ta-exec-log-clear-status" style="display:none"></span>
              </div>
            </div>
            <div class="ta-panel-body">
              <pre class="ta-code" id="ta-exec-log"></pre>
            </div>
          </div>

          <p class="ta-note">実行履歴は既存の実行基盤を共用しています。スケジュール登録は未実装です。</p>
        </section>
