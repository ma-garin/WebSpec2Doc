<p><a href="index.html">一覧へ戻る</a></p><h1>お届け先管理</h1>
<p>お届け先は最大 5 件まで登録できます。保存すると次回以降も一覧に表示されます。</p>
<form action="#" method="post">
<label>宛名 ※ <input type="text" required maxlength="30"></label>
<label>郵便番号 ※ <input type="text" required pattern="[0-9]{3}-[0-9]{4}"></label>
<label>住所 ※ <input type="text" required maxlength="100"></label>
<button>追加</button></form>
<p class="n">5 件登録済みの場合は追加ボタンを無効にします。</p>
</body></html>
