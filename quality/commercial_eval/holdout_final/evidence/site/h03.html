<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>コース検索 | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>学習コース検索</h1>
<h2>検索条件</h2>
<form id="s" action="h03.html" method="get">
<div class="row"><input type="text" id="f1" name="keyword" maxlength="50" placeholder="キーワードを入力"></div>
<div class="row"><label for="f2">レベル</label><select id="f2" name="level"><option value="">すべて</option><option value="b">入門</option><option value="a">応用</option></select></div>
<div class="row"><input type="checkbox" id="f3" name="free"><label for="f3">無料コースのみ</label></div>
<input type="submit" value="検索">
<input type="button" value="条件をクリア">
</form>
<h2>検索結果</h2>
<div style="visibility:hidden"><p>該当するコースがありません</p><button type="button">条件を緩める</button></div>
<div id="c-err"></div>
<table><thead><tr><th>コース名</th><th>受講料</th><th>期間</th></tr></thead><tbody><tr><td><a href="h04.html?course=101">Python入門</a></td><td>12,000円</td><td>4週間</td></tr><tr><td><a href="h04.html?course=102">統計の基礎</a></td><td>無料</td><td>2週間</td></tr><tr><td><a href="h04.html?course=103">データ分析演習</a></td><td>24,000円</td><td>8週間</td></tr></tbody></table>
<footer><h3>お問い合わせ</h3><p>電話 0120-000-000 (平日 9:00-17:00)</p></footer>
<script>(function(){var box=document.getElementById("c-err");fetch("/api/courses").then(function(r){if(!r.ok){throw new Error("x");}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="コース情報を取得できませんでした";box.appendChild(q);});})();</script>
</main>
</body></html>
