<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>メンバーの招待 | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>メンバーの招待</h1>
<section class="spec"><h2>画面の説明</h2><ul><li>メールアドレスは必須。メールアドレスの形式でなければ「メールアドレスの形式が正しくありません」と表示する。</li><li>招待できるのは「管理者」だけ。管理者以外が実行すると「権限がありません」と表示する。</li><li>招待は /api/invitations に POST する。</li></ul></section>
<section><h2>画面</h2>
<form><label for="e">メールアドレス</label><input type="email" id="e" name="email" required maxlength="80"><button type="button" id="go">招待する</button></form><p id="msg"></p>
</section>
<script>(function(){var b=document.getElementById("go");if(!b){return;}b.addEventListener("click",function(){fetch("/api/invitations",{method:"POST"}).then(function(r){if(!r.ok){throw new Error("x");}return r.json();}).catch(function(){document.getElementById("msg").textContent="権限がありません";});});})();</script>
</main>
</body></html>
