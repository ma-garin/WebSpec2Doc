<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>通知設定</title><style>body{font-family:sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}.n{color:#555;font-size:.9em}button{margin:.4em .3em .4em 0}</style></head><body>
<p><a href="index.html">一覧へ戻る</a></p><h1>通知設定</h1>
<p>変更を保存するとサーバに送信されます（PUT /api/settings）。保存に失敗した場合は「保存できませんでした」と「再試行」ボタンを表示します。</p>
<form action="/api/settings" method="post">
<label>通知先メールアドレス <input type="email" name="mail"></label>
<label>一覧の表示件数 <select name="n"><option>10</option><option>20</option><option>50</option></select></label>
<label><input type="checkbox" name="push"> プッシュ通知を受け取る</label>
<button type="submit">保存</button></form>
<p class="n">保存後に画面を再読み込みしても、設定値が維持されます。</p>
</body></html>
