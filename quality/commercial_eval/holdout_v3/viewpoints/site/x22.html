<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワードの変更</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>パスワードの変更</h1><p>ログイン中のユーザーが自分のパスワードを変更します。現在のパスワード、新しいパスワード、確認用の3つはすべて必須です。</p><p>新しいパスワードは8〜64文字で、英字と数字の両方を含める必要があります。英字だけ、数字だけのパスワードは拒否します。確認用が一致しないときは「パスワードが一致しません」と表示します。</p><p>「変更」で POST /api/account/password に送信します。現在のパスワードを5回続けて間違えるとアカウントが「ロック」状態になり、ロック中は変更操作ができません。</p><form method="post" action="/api/account/password"><p><label>現在のパスワード<br><input type="password" name="cur" required></label></p><p><label>新しいパスワード<br><input type="password" name="new" required minlength="8" maxlength="64"></label></p><p><label>新しいパスワード（確認）<br><input type="password" name="new2" required></label></p><button type="submit">変更</button></form></body></html>
