<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>トレーサビリティマトリクス — WebSpec2Doc</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  {# 単体ページとして開くため、SPA 本体（index.html）とは別に必要なものを自分で読み込む。
     これが無かったため、これまで表が描画されず「読み込み中...」のまま止まっていた。 #}
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}?v={{ _ver }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ _ver }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v={{ _ver }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/c-hybrid.css') }}?v={{ _ver }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/c-shell.css') }}?v={{ _ver }}">
  <style>
    body { margin: 0; background: var(--bg); }
    .tc-page { max-width: 1180px; margin: 0 auto; padding: 24px 24px 60px; }
    /* SPA では .view は is-active のときだけ表示される。単体ページでは常に見せる。 */
    .tc-page .view { display: block; }
    /* タップ領域 24x24px 以上を確保する（WCAG 2.5.8 AA）。負のマージンで視覚位置は維持。 */
    .tc-back {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 6px;
      margin: -4px -6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--primary-dark);
      text-decoration: none;
    }
    .tc-back:hover, .tc-back:focus-visible {
      text-decoration: underline;
      background: var(--surface-soft);
    }
    .tc-back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="tc-page">
    <a class="tc-back" href="/">← ホームへ戻る</a>
    {% include "partials/view-traceability.html" %}
  </div>
  <script src="{{ url_for('static', filename='js/c-hybrid.js') }}?v={{ _ver }}"></script>
  <script src="{{ url_for('static', filename='js/traceability.js') }}?v={{ _ver }}"></script>
  <script>
    // ドメインはサーバ側で検証済みの値をそのまま渡す（画面側で組み立てない）
    initTraceability({{ domain | tojson }});
  </script>
</body>
</html>
