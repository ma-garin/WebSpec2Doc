{#- 状態: restored。親に class="ui-state-root" data-state="..." を付け、その直下に include する。文言は UIStates.set の opts で上書きする。 -#}
<section class="ui-state-pane" data-pane="restored" role="status">
  <p class="ui-state-title">{{ state_title|default('前回の続きを復元しました') }}</p>
  <p class="ui-state-message">{{ state_message|default('保存前に閉じた編集内容を戻しています。') }}</p>
  <p class="ui-state-next">{{ state_next|default('内容を確かめてから保存してください。不要なら破棄できます。') }}</p>
</section>
