<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メンバーの招待</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>メンバーの招待</h1><p>チームにメンバーを招待します。招待できるのは管理者ロールのみで、編集者と閲覧者は画面を開いても送信できません。</p><p>メールアドレスは必須で、正しい形式でない値は拒否します。ロールは管理者・編集者・閲覧者から選びます。</p><p>「招待を送る」で POST /api/invitations に送信します。招待済みのメールアドレスはもう一度招待できません（重複は拒否）。送信に失敗したときは「送信に失敗しました」と表示し、「再試行」ボタンでもう一度送れます。</p><form method="post" action="/api/invitations"><p><label>メールアドレス<br><input type="email" name="email" required></label></p><p><label>ロール<br><select name="role"><option>管理者</option><option>編集者</option><option>閲覧者</option></select></label></p><button type="submit">招待を送る</button> <button type="button">再試行</button></form></body></html>
