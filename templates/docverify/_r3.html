{# SCR-06-07 トレーサビリティ（R3）。描画は static/js/docverify-r3.js。網羅性は常に「未検証」と出す #}
<section class="dv-view dvr-view dv3" data-view="setcheck" hidden>
  <header class="dv3-head">
    <div class="dv3-head-main">
      <h2 class="dvr-title">トレーサビリティ</h2>
      <p class="dv3-lead" id="dv3Lead">読み込み中…</p>
      <p class="dv3-coverage" role="note">網羅性: 未検証</p>
    </div>
    <div class="dv3-actions">
      <button type="button" class="btn-primary" id="dv3Run">検査を実行</button>
      <button type="button" class="btn-outline-sm" id="dv3Xlsx">Excel で出力</button>
      <button type="button" class="btn-outline-sm" id="dv3AddBtn" aria-expanded="false" aria-controls="dv3AddPanel">文書を追加</button>
    </div>
  </header>
  <div class="dv3-msg" id="dv3Msg" role="status" aria-live="polite"></div>

  <section class="dv3-add" id="dv3AddPanel" hidden aria-label="文書の追加">
    <form class="dv3-upload" id="dv3Upload">
      <label class="dv3-field">種別<select id="dv3Kind" required><option value="">選んでください</option></select></label>
      <label class="dv3-field">文書<input type="file" id="dv3File" accept=".txt,.md,.docx,.xlsx,.pdf" required></label>
      <label class="dv3-check"><input type="checkbox" id="dv3Hidden" checked> 非表示のシート・列も検出の対象にする</label>
      <button type="submit" class="btn-primary" id="dv3UploadBtn">登録する</button>
    </form>
  </section>

  <section class="dv3-flow" id="dv3Flow" aria-label="文書の流れ"></section>

  <section class="dv3-issues" aria-labelledby="dv3IssuesH">
    <h3 class="dv3-h" id="dv3IssuesH">直すべきこと</h3>
    <div class="dv3-issues-body">
      <fieldset class="dv3-filter" id="dv3Filter"><legend>種類で絞る</legend></fieldset>
      <div class="dv3-list" id="dv3List"></div>
    </div>
  </section>

  <details class="dv3-fold">
    <summary>すべてのつながりを見る</summary>
    <div class="dv3-fold-body">
      <div class="dv3-actions">
        <label class="dv3-field">ID の書式<select id="dv3Format"></select></label>
      </div>
      <div id="dv3TraceSummary"></div>
      <div class="dv-tscroll" id="dv3Trace"></div>
      <div class="dv-tscroll" id="dv3Docs"></div>
    </div>
  </details>

  <details class="dv3-fold">
    <summary>検査の設定（規則と組織の語彙）</summary>
    <div class="dv3-fold-body">
      <form id="dv3Rules" class="dv3-rules">
        <fieldset class="dv3-fieldset"><legend>使う規則</legend><div id="dv3RuleList"></div></fieldset>
        <label class="dv3-field">禁止語（1 行に 1 つ）<textarea id="dv3Forbidden" rows="3"></textarea></label>
        <label class="dv3-field">許容語（候補から外す語。1 行に 1 つ）<textarea id="dv3Allowed" rows="3"></textarea></label>
        <label class="dv3-field">同義語（標準語＝社内語。1 行に 1 組）<textarea id="dv3Synonyms" rows="3" placeholder="お客様＝顧客"></textarea></label>
        <button type="submit" class="btn-primary">設定を保存</button>
      </form>
    </div>
  </details>
</section>
