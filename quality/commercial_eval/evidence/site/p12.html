<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ユーザー編集 | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>ユーザー編集</h1>
<form id="useredit" action="#" method="post" novalidate>
<h2>基本情報</h2>
<div class="row"><label for="user_id">ユーザーID</label><input type="text" id="user_id" name="user_id" required maxlength="10"></div>
<div class="row"><label for="name">氏名</label><input type="text" id="name" name="name" required maxlength="40" minlength="2"></div>
<div class="row"><label for="email">メールアドレス</label><input type="email" id="email" name="email" required maxlength="100"></div>
<div class="row"><label for="tel">電話番号</label><input type="tel" id="tel" name="tel" maxlength="13" pattern="^0\d{1,4}-\d{1,4}-\d{4}$"></div>
<div class="row"><label for="emp_no">社員番号</label><input type="number" id="emp_no" name="emp_no" required min="1" max="99999"></div>
<h2>権限</h2>
<div class="row"><label for="role">権限</label><select id="role" name="role" required><option value="">選択</option><option value="admin">管理者</option><option value="user">一般</option><option value="view">閲覧のみ</option></select></div>
<div class="row"><input type="radio" id="status-active" name="status" value="active"><label for="status-active">有効</label></div>
<div class="row"><input type="radio" id="status-inactive" name="status" value="inactive"><label for="status-inactive">無効</label></div>
<div class="row"><textarea id="memo" name="memo" maxlength="500" aria-label="備考" rows="4"></textarea></div>
<input type="hidden" name="id" value="12">
<input type="hidden" name="version" value="3">
<div id="useredit-errors" aria-live="polite"></div>
<input type="submit" value="保存">
<button type="button">キャンセル</button>
<button type="button">削除</button>
</form>
<a href="p11.html">一覧へ戻る</a>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script>
(function(){var f=document.getElementById("useredit");var box=document.getElementById("useredit-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(f.elements["name"].value===''){errs.push("氏名は必須です");}if(!/^\d+$/.test(f.elements["emp_no"].value)){errs.push("社員番号は数字で入力してください");}if(f.elements["role"].value===''){errs.push("権限を選択してください");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/users",{method:"PUT",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="ユーザーを更新できませんでした";box.appendChild(q);});}});})();
</script>
</body></html>
