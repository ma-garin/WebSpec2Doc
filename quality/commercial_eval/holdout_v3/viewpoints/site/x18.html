<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議室の予約</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>会議室の予約</h1><p>会議室を予約します。日付、開始時刻、利用人数は必須です。利用人数は1〜12人で、日付は「2026-11-05」の形式、時刻は「09:30」の形式で入力します。</p><p>「予約する」で POST /api/reservations に送信します。同じ会議室の同じ時間帯に既に予約がある場合は「その時間は予約済みです」と赤字で表示して拒否します。</p><p>予約した内容は、画面を再読み込みしても下の「予約一覧」に残って表示されます。</p><form method="post" action="/api/reservations"><p><label>日付<br><input type="date" name="d" required></label></p><p><label>開始時刻<br><input type="time" name="t" required></label></p><p><label>利用人数<br><input type="number" name="n" required min="1" max="12"></label></p><button type="submit">予約する</button></form><h2>予約一覧</h2><ul id="mine"></ul></body></html>
