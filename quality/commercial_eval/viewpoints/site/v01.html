<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会員登録</title><style>body{font-family:sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}.n{color:#555;font-size:.9em}button{margin:.4em .3em .4em 0}</style></head><body>
<p><a href="index.html">一覧へ戻る</a></p><h1>会員登録</h1>
<p>※ は必須項目です。登録するとサーバに送信されます（POST /api/members）。</p>
<form action="/api/members" method="post">
<label>メールアドレス ※ <input type="email" name="email" required maxlength="254"></label>
<label>氏名 ※ <input type="text" name="name" required maxlength="30"></label>
<p class="n">氏名に記号・絵文字は使用できません。</p>
<label>パスワード ※ <input type="password" name="pw" required minlength="8" maxlength="32"></label>
<label>年齢 <input type="number" name="age" min="18" max="120"></label>
<p class="n">18 歳以上 120 歳以下でご入力ください。</p>
<label>電話番号 <input type="tel" name="tel" pattern="0[0-9]{9,10}" placeholder="0312345678"></label>
<p class="n">ハイフンなしの半角数字 10〜11 桁。入力に誤りがある場合は項目の下にエラーを表示します。</p>
<button type="submit">登録する</button></form>
</body></html>
