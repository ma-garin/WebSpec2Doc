<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>注文内容の確認 | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>注文内容の確認</h1>
<h2>お届け先</h2>
<p>山田 太郎 / 〒100-0001 東京都千代田区</p>
<h2>ご注文商品</h2>
<table><thead><tr><th>商品名</th><th>数量</th><th>小計</th></tr></thead><tbody><tr><td>ワイヤレスマウス M-200</td><td>1</td><td>2,480円</td></tr><tr><td>USBハブ 4ポート</td><td>2</td><td>3,960円</td></tr></tbody></table>

<form id="confirm" action="#" method="post" novalidate>

<script>
(function(){var f=document.getElementById("confirm");var box=document.getElementById("confirm-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/orders/confirm",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="注文を確定できませんでした";box.appendChild(q);});}});})();
</script>
