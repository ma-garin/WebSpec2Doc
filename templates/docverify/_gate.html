{# 判定と記録（対検査の Gate API に接続）。描画は static/js/docverify-cases.js #}
<section class="dv-view dvg" data-view="gate" data-state="loading" hidden aria-labelledby="dvg-title">
  <div class="p1-head">
    <h2 id="dvg-title" class="dvc-title">判定と記録</h2>
    <span class="dvc-sub" data-gate-ver></span>
    <span class="sp"></span>
    <button type="button" class="p1-btn" data-gate-act="pair">対検査へ</button>
    <button type="button" class="p1-btn" data-dv-report>指摘書を出力</button>
    <button type="button" class="p1-btn" data-gate-act="reload">再読み込み</button>
  </div>
  <p class="dvc-msg" role="status" aria-live="polite" data-gate-msg></p>
  <div class="dvg-body" data-gate-body></div>
</section>
