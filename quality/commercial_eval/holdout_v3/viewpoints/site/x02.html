<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>処方箋の進捗管理</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>処方箋の進捗管理</h1><p>処方箋は「受付」→「調剤中」→「監査待ち」→「交付済」の順に進みます。現在の段階は画面上部に表示されます。</p><p>「次の段階へ」ボタンで1段階ずつ進め、「差し戻し」ボタンで1段階前に戻せます。「交付済」になった処方箋は変更できません。</p><p>「監査待ち」から「交付済」への操作は薬剤師ロールのみ可能で、事務員ロールにはボタンが表示されません。</p><p>現在の段階: <strong id="stage">受付</strong></p><button type="button">次の段階へ</button> <button type="button">差し戻し</button></body></html>
