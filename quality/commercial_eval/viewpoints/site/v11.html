<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>履歴検索</title><style>body{font-family:sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}.n{color:#555;font-size:.9em}button{margin:.4em .3em .4em 0}</style></head><body>
<p><a href="index.html">一覧へ戻る</a></p><h1>履歴検索</h1>
<form action="#" method="get">
<label>開始日 <input type="date" name="from"></label>
<label>終了日 <input type="date" name="to"></label>
<p class="n">終了日は開始日以降の日付を指定してください。</p>
<label>金額（下限） <input type="number" name="min" min="0" max="10000000"></label>
<label>金額（上限） <input type="number" name="max" min="0" max="10000000"></label>
<button>検索</button></form>
</body></html>
