{#- 状態: error。親に class="ui-state-root" data-state="..." を付け、その直下に include する。文言は UIStates.set の opts で上書きする。 -#}
<section class="ui-state-pane" data-pane="error" role="alert">
  <p class="ui-state-title">{{ state_title|default('読み込めませんでした') }}</p>
  <p class="ui-state-message">{{ state_message|default('一時的に内容を取得できませんでした。') }}</p>
  <p class="ui-state-next">{{ state_next|default('少し待ってから「もう一度読み込む」を押してください。') }}</p>
</section>
