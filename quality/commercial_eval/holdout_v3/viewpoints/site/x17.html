<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>取引履歴の照会</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>取引履歴の照会</h1><p>期間を指定して取引履歴を表示します。開始日と終了日は「2026-01-31」の形式の日付で、どちらも任意です。</p><p>検索は GET /api/transactions で行います。開始日が終了日より後のときは「期間が正しくありません」と表示します。該当する取引が1件も無いときは「該当する取引はありません」と表示します。</p><form method="get" action="/api/transactions"><p><label>開始日<br><input type="date" name="from"></label></p><p><label>終了日<br><input type="date" name="to"></label></p><button type="submit">照会</button></form><div id="rows"></div></body></html>
