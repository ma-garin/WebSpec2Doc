        <!-- ===== 実行履歴ビュー =====
             種別タブは廃止した。5 タブのうち「現新比較」「UXレビュー」「スケジュール」は
             実データが 0 件で、押しても「実行履歴がありません」しか出なかった。
             「すべて」は別システム（AutoRun）の記録が混ざり、このシステムの分が埋もれていた。
             種別は行のバッジで示し、絞り込みは要るときだけ開く。 -->
        <section class="view" id="view-run-history">
          <div class="rh-head">
            <span class="rh-count" id="rh-count"></span>
            <span class="rh-sub" id="rh-sub"></span>
            <span class="rh-head-actions">
              <button type="button" class="btn-outline-sm rh-filter-toggle" id="rh-filter-btn"
                      aria-expanded="false" aria-controls="rh-filter">絞り込み</button>
              <button type="button" id="rh-reload-btn" class="btn-outline-sm">↺ 再読み込み</button>
            </span>
          </div>

          <!-- 絞り込み。既定は閉じる（件数が少ないうちは邪魔になるため）。
               該当 0 件の選択肢は出さない（押しても何も出ない選択肢を並べない）。 -->
          <div class="rh-filter" id="rh-filter" hidden>
            <div class="rh-filter-row">
              <span class="rh-filter-label">サイト</span>
              <span class="rh-chips" id="rh-site-chips"></span>
            </div>
            <div class="rh-filter-row">
              <span class="rh-filter-label">期間</span>
              <input type="date" id="rh-from" aria-label="開始日">
              <span class="rh-tilde">〜</span>
              <input type="date" id="rh-to" aria-label="終了日">
              <button type="button" class="rh-chip" data-range="7">直近7日</button>
              <button type="button" class="rh-chip" data-range="30">直近30日</button>
            </div>
            <div class="rh-filter-row">
              <span class="rh-filter-label">状態</span>
              <span class="rh-chips" id="rh-status-chips"></span>
            </div>
            <div class="rh-filter-row">
              <span class="rh-filter-label">種別</span>
              <span class="rh-chips" id="rh-type-chips"></span>
            </div>
          </div>

          <div class="rh-applied" id="rh-applied" hidden></div>

          <!-- ===== 実行傾向 =====
               1 回の結果だけでは「不安定なのか今回だけ落ちたのか」が分からない。
               実行回を横断した集計（/api/runs/<domain>/trends）をここに出す。
               サイト単位でしか意味を持たないため、対象サイトを選ばせる。 -->
          <section class="rt-panel" id="rt-panel" hidden>
            <div class="rt-head">
              <h3 class="rt-title">実行傾向</h3>
              <label class="rt-site-label" for="rt-site">対象サイト</label>
              <select id="rt-site" class="rt-site"></select>
              <label class="rt-site-label" for="rt-limit">集計範囲</label>
              <select id="rt-limit" class="rt-site">
                <option value="10">直近10回</option>
                <option value="30" selected>直近30回</option>
                <option value="100">直近100回</option>
              </select>
              <button type="button" class="btn-outline-sm" id="rt-reload">↺ 更新</button>
            </div>

            <div class="rt-body" id="rt-body">
              <div class="rt-state" id="rt-state">対象サイトを選ぶと傾向を集計します。</div>

              <div class="rt-tiles" id="rt-tiles" hidden>
                <div class="rt-tile">
                  <span class="rt-tile-label">最新パス率</span>
                  <span class="rt-tile-value" id="rt-pass-rate">—</span>
                  <span class="rt-tile-delta" id="rt-pass-delta"></span>
                </div>
                <div class="rt-tile">
                  <span class="rt-tile-label">不安定なテスト</span>
                  <span class="rt-tile-value" id="rt-unstable">—</span>
                  <span class="rt-tile-note">リトライで通った</span>
                </div>
                <div class="rt-tile">
                  <span class="rt-tile-label">継続失敗</span>
                  <span class="rt-tile-value" id="rt-persist">—</span>
                  <span class="rt-tile-note">2回以上連続</span>
                </div>
                <div class="rt-tile">
                  <span class="rt-tile-label">自己修復</span>
                  <span class="rt-tile-value" id="rt-healed">—</span>
                  <span class="rt-tile-note">候補が変わった</span>
                </div>
              </div>

              <figure class="rt-chart" id="rt-chart" hidden>
                <figcaption class="rt-chart-cap">パス率の推移（左が古い）</figcaption>
                <div class="rt-chart-area" id="rt-chart-area"></div>
              </figure>

              <div class="rt-tables" id="rt-tables" hidden>
                <div class="rt-tablewrap">
                  <h4 class="rt-subtitle">不安定なテスト</h4>
                  <table class="rt-table"><thead><tr>
                    <th>テスト</th><th class="rt-num">回数</th><th class="rt-num">率</th><th>直近の失敗理由</th>
                  </tr></thead><tbody id="rt-flaky"></tbody></table>
                </div>
                <div class="rt-tablewrap">
                  <h4 class="rt-subtitle">失敗が続いているテスト</h4>
                  <table class="rt-table"><thead><tr>
                    <th>テスト</th><th class="rt-num">連続</th><th class="rt-num">失敗率</th><th>直近の失敗理由</th>
                  </tr></thead><tbody id="rt-failing"></tbody></table>
                </div>
                <div class="rt-tablewrap">
                  <h4 class="rt-subtitle">自己修復したロケータ</h4>
                  <table class="rt-table"><thead><tr>
                    <th>本来の候補</th><th>実際に効いた候補</th><th class="rt-num">回数</th><th>対象</th>
                  </tr></thead><tbody id="rt-healing"></tbody></table>
                </div>
              </div>

              <p class="rt-note" id="rt-skipped" hidden></p>
            </div>
          </section>

          <div id="rh-container">
            <table class="rh-table">
              <thead>
                <!-- 実測 880px 幅に合わせる。固定幅の合計を抑え、サイト名（最長
                     hotel-example-site.takeyaqa.dev）が折り返さない幅を可変列へ残す。 -->
                <tr>
                  <th class="rh-col-type">種別</th>
                  <th class="rh-sortable rh-col-site" data-sort="domain">サイト<span class="rh-arrow"></span></th>
                  <th class="rh-sortable rh-col-ts" data-sort="ts">日時<span class="rh-arrow"></span></th>
                  <th class="rh-col-status">状態</th>
                  <th class="rh-sortable rh-num rh-col-n" data-sort="screens">画面<span class="rh-arrow"></span></th>
                  <th class="rh-sortable rh-num rh-col-n" data-sort="conds">条件<span class="rh-arrow"></span></th>
                  <th class="rh-sortable rh-num rh-col-n" data-sort="docs">成果物<span class="rh-arrow"></span></th>
                  <th class="rh-col-act">操作</th>
                </tr>
              </thead>
              <tbody id="rh-tbody"></tbody>
            </table>
            <div id="rh-empty" style="display:none">実行履歴がありません。</div>
            <div id="rh-pager" class="pager-wrap"></div>
          </div>
        </section>
