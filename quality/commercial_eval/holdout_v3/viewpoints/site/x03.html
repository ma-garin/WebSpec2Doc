<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成績の入力</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>成績の入力</h1><p>担当教員が学生の試験の点数を登録します。教員ロール以外のユーザーにはこの画面の入力欄は無効になります。</p><p>学生番号は数字7桁、点数は0〜100の整数です。範囲外の点数は「0から100で入力してください」と表示して送信を止めます。点数に文字は入力できません。</p><p>「登録」を押すと POST /api/grades に送信します。</p><form method="post" action="/api/grades"><p><label>学生番号<br><input type="text" name="sid" required pattern="[0-9]{7}"></label></p><p><label>点数<br><input type="number" name="score" required min="0" max="100" step="1"></label></p><button type="submit">登録</button></form></body></html>
