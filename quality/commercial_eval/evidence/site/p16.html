<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>レポート出力 | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>レポート出力</h1>
<button type="button">出力</button>
<h2>出力条件</h2>
<form id="report" action="#" method="post" novalidate>
<div class="row"><label for="from">開始日</label><input type="date" id="from" name="from" required></div>
<div class="row"><label for="to">終了日</label><input type="date" id="to" name="to" required></div>
<div class="row"><label for="kind">レポート種別</label><select id="kind" name="kind" required><option value="">選択</option><option value="sales">売上</option><option value="stock">在庫</option></select></div>
<div class="row"><input type="radio" id="fmt-csv" name="fmt" value="csv"><label for="fmt-csv">CSV</label></div>
<div class="row"><input type="radio" id="fmt-xlsx" name="fmt" value="xlsx"><label for="fmt-xlsx">Excel</label></div>
<div class="row"><input type="radio" id="fmt-pdf" name="fmt" value="pdf"><label for="fmt-pdf">PDF</label></div>
<div class="row"><label><input type="checkbox" id="with_header" name="with_header"> 見出し行を含める</label></div>
<div id="report-errors" aria-live="polite"></div>
<input type="submit" value="出力">
<button type="button">プレビュー</button>
</form>
<div id="dyn8" class="dyn"></div>
<a href="p10.html">ダッシュボードへ</a>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script>
(function(){var f=document.getElementById("report");var box=document.getElementById("report-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(f.elements["from"].value===''){errs.push("開始日を入力してください");}if(f.elements["to"].value<f.elements["from"].value){errs.push("終了日は開始日以降を指定してください");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/reports",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="レポートを出力できませんでした";box.appendChild(q);});}});})();
document.addEventListener("DOMContentLoaded",function(){var c=document.getElementById("dyn8");var h2=document.createElement("h2");h2.textContent="出力履歴";c.appendChild(h2);var b=document.createElement("button");b.type="button";b.textContent="再出力";c.appendChild(b);});
</script>
</body></html>
