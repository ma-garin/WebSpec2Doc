<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知設定</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>通知設定</h1><p>メール通知の種類をオン・オフします。「保存」を押すと PUT /api/settings/notifications に設定を送ります。</p><p>保存した設定は、画面を再読み込みしても同じ状態で表示されます。</p><form method="post" action="/api/settings/notifications"><p><label><input type="checkbox" name="mail_news" checked> お知らせ</label></p><p><label><input type="checkbox" name="mail_alert"> 障害通知</label></p><p><label><input type="checkbox" name="mail_weekly"> 週次レポート</label></p><button type="submit">保存</button></form></body></html>
