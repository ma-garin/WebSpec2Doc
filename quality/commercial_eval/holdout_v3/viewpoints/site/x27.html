<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寄付の申込</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>寄付の申込</h1><p>寄付を申し込む画面です。金額は500円〜100,000円で、500円単位で必須入力です。領収書の送付先メールアドレスは任意ですが、入力するなら正しい形式でなければ拒否します。</p><p>「申し込む」で POST /api/donations に送信します。申込後の内容はマイページの「寄付履歴」に保存され、再読み込みしても再表示されます。</p><form method="post" action="/api/donations"><p><label>金額（円）<br><input type="number" name="amount" required min="500" max="100000" step="500"></label></p><p><label>支払い方法<br><select name="pay"><option>クレジットカード</option><option>銀行振込</option></select></label></p><p><label>領収書送付先メール（任意）<br><input type="email" name="mail"></label></p><button type="submit">申し込む</button></form><h2>寄付履歴</h2><ul id="hist"></ul></body></html>
