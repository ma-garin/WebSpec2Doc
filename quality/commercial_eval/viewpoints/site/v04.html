<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>注文確定</title><style>body{font-family:sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}.n{color:#555;font-size:.9em}button{margin:.4em .3em .4em 0}</style></head><body>
<p><a href="index.html">一覧へ戻る</a></p><h1>注文確定</h1>
<p>注文内容を確認して「注文を確定する」を押してください。確定すると注文番号が表示され、注文履歴に保存されます（POST /api/orders）。</p>
<form action="/api/orders" method="post">
<label>数量 ※ <input type="number" name="qty" required min="1" max="99"></label>
<label>郵便番号 ※ <input type="text" name="zip" required pattern="[0-9]{3}-[0-9]{4}" placeholder="123-4567"></label>
<label>お届け希望日 <input type="date" name="d" min="2026-10-21" max="2026-12-31"></label>
<label>お支払い方法 ※ <select name="pay" required><option value="">選択してください</option><option>クレジットカード</option><option>代金引換</option></select></label>
<p class="n">在庫を超える数量の場合は「在庫が不足しています」を表示し、数量を直して再度確定できます。</p>
<button type="submit">注文を確定する</button></form>
</body></html>
