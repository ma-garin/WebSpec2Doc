<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>設定 | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>設定</h1>
<form id="settings" action="#" method="post" novalidate>
<h2>通知</h2>
<div class="row"><label><input type="checkbox" id="notify_mail" name="notify_mail"> メール通知を受け取る</label></div>
<div class="row"><label><input type="checkbox" id="notify_push" name="notify_push"> プッシュ通知を受け取る</label></div>
<h2>表示</h2>
<div class="row"><input type="radio" id="theme-light" name="theme" value="light"><label for="theme-light">ライト</label></div>
<div class="row"><input type="radio" id="theme-dark" name="theme" value="dark"><label for="theme-dark">ダーク</label></div>
<div class="row"><label for="page_size">1ページの表示件数</label><input type="number" id="page_size" name="page_size" min="10" max="100"></div>
<span class="field-error" id="page_size-err" aria-live="polite"></span>
<h2>セキュリティ</h2>
<div class="row"><label for="cur_pw">現在のパスワード</label><input type="password" id="cur_pw" name="cur_pw" required></div>
<div class="row"><input type="password" id="new_pw" name="new_pw" maxlength="64" minlength="8" aria-label="新しいパスワード"></div>
<div id="settings-errors" aria-live="polite"></div>
<input type="submit" value="保存">
<button type="button">保存</button>
<button type="button">キャンセル</button>
</form>
<div id="dyn8" class="dyn"></div>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script>
(function(){var el=document.getElementById("page_size");var s=document.getElementById("page_size-err");el.addEventListener("blur",function(){var v=el.value;s.textContent=(v!==''&&(Number(v)<10||Number(v)>100))?"表示件数は10〜100の範囲で指定してください":"";});})();
(function(){var f=document.getElementById("settings");var box=document.getElementById("settings-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/settings",{method:"PUT",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="設定を保存できませんでした";box.appendChild(q);});}});})();
document.addEventListener("DOMContentLoaded",function(){var c=document.getElementById("dyn8");var h2=document.createElement("h2");h2.textContent="接続中のデバイス";c.appendChild(h2);});
</script>
</body></html>
