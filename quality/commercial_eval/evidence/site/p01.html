<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>会員登録 | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>会員登録</h1>
<button type="button">登録する</button>
<h2>基本情報</h2>
<h3>ご注意</h3>
<p>全ての項目をご入力ください。</p>
<form id="reg" action="#" method="post" novalidate>
<div class="row"><label for="full_name">氏名</label><input type="text" id="full_name" name="full_name" required maxlength="40" minlength="2"></div>
<div class="row"><label for="kana">フリガナ</label><input type="text" id="kana" name="kana" required maxlength="60" pattern="^[ァ-ヶー　]+$"></div>
<div class="row"><label for="email">メールアドレス</label><input type="email" id="email" name="email" required maxlength="100"></div>
<div class="row"><label for="pw">パスワード</label><input type="password" id="pw" name="pw" required maxlength="64" minlength="8" pattern="^(?=.*[A-Za-z])(?=.*\d).{8,64}$"></div>
<div class="row"><input type="password" id="pw2" name="pw2" required aria-label="パスワード（確認）"></div>
<div class="row"><label for="tel">電話番号</label><input type="tel" id="tel" name="tel" maxlength="11" pattern="^0\d{9,10}$"></div>
<div class="row"><label for="birth">生年月日</label><input type="date" id="birth" name="birth" min="1900-01-01" max="2010-12-31"></div>
<div class="row"><label for="pref">都道府県</label><select id="pref" name="pref" required><option value="">選択してください</option><option value="13">東京都</option><option value="27">大阪府</option><option value="01">北海道</option></select></div>
<div class="row"><input type="radio" id="gender-m" name="gender" value="m"><label for="gender-m">男性</label></div>
<div class="row"><input type="radio" id="gender-f" name="gender" value="f"><label for="gender-f">女性</label></div>
<div class="row"><input type="radio" id="gender-o" name="gender" value="o"><label for="gender-o">回答しない</label></div>
<div class="row"><label for="note">自己紹介</label><textarea id="note" name="note" maxlength="200" rows="4"></textarea></div>
<div class="row"><input type="checkbox" id="agree" name="agree" required><label for="agree">利用規約に同意する</label></div>
<input type="hidden" name="csrf_token" value="tok-7788">
<div hidden><button type="button">管理者として登録</button></div>
<div id="reg-errors" aria-live="polite"></div>
<button type="submit">登録する</button>
<input type="button" value="キャンセル">
</form>
<a href="p02.html">ログインはこちら</a>
<a href="https://example.com/privacy">プライバシーポリシー(外部サイト)</a>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script>
(function(){var f=document.getElementById("reg");var box=document.getElementById("reg-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(f.elements["full_name"].value===''){errs.push("氏名を入力してください");}if(f.elements["email"].value.indexOf('@')<0){errs.push("メールアドレスの形式が正しくありません");}if(f.elements["pw"].value.length<8){errs.push("パスワードは8文字以上で入力してください");}if(f.elements["pw"].value!==f.elements["pw2"].value){errs.push("パスワードが一致しません");}if(!f.elements["agree"].checked){errs.push("利用規約への同意が必要です");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/members",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="登録に失敗しました。時間をおいて再度お試しください";box.appendChild(q);});}});})();
</script>
</body></html>
