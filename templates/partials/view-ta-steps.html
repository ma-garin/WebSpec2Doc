        <!-- ===== テスト自動化 / ステップ編集 =====
             テスト活動支援（System 02）の実装画面から移設。id / class（ns-*）は
             static/js/test-step-editor.js が参照しているため 1 文字も変えていない。 -->
        <section class="view" id="view-test-steps">
          <div class="dash-hero">
            <div class="dash-hero-main">
              <h1 class="dash-hero-title">ステップ編集（ノーコード）</h1>
              <p class="dash-hero-sub">対象サイトを選び、コードを書かずにテストのステップを組み立てます。保存したステップからコードを生成し、そのまま実ブラウザで実行できます。</p>
            </div>
          </div>

        <!-- ===== ステップ編集（ノーコード） =====
             生成された .spec.ts を直接編集すると、再生成のたびに消える。
             編集の正本はステップ列（test_steps.json）とし、コードは常にそこから生成する。
             動作の語彙は /api/test-steps/actions から取る（画面と保存側で二重定義しない）。 -->
        <section class="ns-panel" id="ns-panel">
          <div class="ns-head">
            <h2 class="ns-title">ステップ編集</h2>
            <span class="ns-sub">コードを書かずにテストを組み立てます。生成されるコードは常にここから作り直されます。</span>
          </div>

          <div class="ns-toolbar">
            <label class="ns-label" for="ns-domain">対象サイト</label>
            <select id="ns-domain" class="ns-select"></select>
            <button type="button" class="btn-outline-sm" id="ns-import">解析結果から取り込む</button>
            <button type="button" class="btn-outline-sm" id="ns-add-test">＋ テストを追加</button>
            <span class="ns-spacer"></span>
            <button type="button" class="btn-outline-sm" id="ns-save">保存</button>
            <button type="button" class="btn-outline-sm" id="ns-generate">コードを生成</button>
            <button type="button" class="btn-outline-sm ns-run-btn" id="ns-run">▶ 実行</button>
          </div>

          <p class="ns-message" id="ns-message" role="status" hidden></p>

          <!-- 実行状況。投入直後（待機）・実行中（進捗）・終端（結果サマリ）を 1 か所に出す。
               進捗が取れないときは「未計測」と書き、0 件（実測して 0）と見た目を分ける。 -->
          <div class="ns-run" id="ns-run-status" hidden>
            <div class="ns-run-head">
              <span class="ns-run-state" id="ns-run-state">—</span>
              <span class="ns-run-job" id="ns-run-job"></span>
              <span class="ns-spacer"></span>
              <button type="button" class="ns-mini ns-mini-danger" id="ns-run-cancel" hidden>中止</button>
            </div>
            <div class="ns-run-bar" id="ns-run-bar" hidden aria-hidden="true">
              <span class="ns-run-bar-fill" id="ns-run-bar-fill"></span>
            </div>
            <p class="ns-run-detail" id="ns-run-detail" role="status"></p>
          </div>

          <div class="ns-tests" id="ns-tests"></div>

          <details class="ns-preview" id="ns-preview" hidden>
            <summary class="ns-preview-sum">生成されたコード <span id="ns-preview-meta"></span></summary>
            <pre class="ns-code" id="ns-code"></pre>
          </details>
        </section>

        </section>
