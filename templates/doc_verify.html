{% set _ver = config.get('ASSET_VERSION', 1) %}<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドキュメント検証 - WebSpec2Doc</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}?v={{ _ver }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ _ver }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app-components.css') }}?v={{ _ver }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v={{ _ver }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/ta2.css') }}?v={{ _ver }}">
<style>
  .dv-doc{display:flex;gap:var(--space-4);align-items:center;padding:var(--space-3) var(--space-4);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm)}
  .dv-doc strong{font-size:var(--text-md)} .mut{color:var(--color-text-secondary)} .dv-ok{color:#047857;font-weight:600}
  .dv-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--space-4);margin-top:var(--space-3)}
  .dv-chips{display:flex;gap:var(--space-2);margin:var(--space-3) 0}
  .dv-chip{border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius-full);padding:4px 12px;font-size:var(--text-sm);cursor:pointer}
  .dv-chip[aria-pressed=true]{border-color:var(--color-primary);background:var(--color-primary-light);color:var(--color-primary-dark);font-weight:600}
  table.dv-t{width:100%;border-collapse:collapse;background:var(--color-surface);border:1px solid var(--color-border);font-size:var(--text-sm)}
  .dv-t th{text-align:left;padding:8px 12px;color:var(--color-text-secondary);font-weight:600;border-bottom:1px solid var(--color-border);background:var(--color-surface-2)}
  .dv-t td{padding:10px 12px;border-bottom:1px solid var(--color-divider);vertical-align:top}
  .dv-t tbody tr{cursor:pointer} .dv-t tr.sel td{background:var(--color-primary-light)}
  .sev{display:inline-block;padding:2px 8px;border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:700;white-space:nowrap;background:var(--color-medium-bg);color:var(--color-medium);border:1px solid var(--color-medium-border)}
  .loc{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-secondary)}
  .dv-side{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-4);font-size:var(--text-sm);align-self:start}
  .dv-side h2{font-size:var(--text-md);margin:6px 0 var(--space-3)}
  .dv-quote{border-left:3px solid var(--color-medium);background:var(--color-surface-2);padding:8px 12px;margin:var(--space-2) 0 var(--space-4);line-height:var(--leading-normal);white-space:pre-wrap}
  .dv-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-6);margin-top:var(--space-3)}
  .dv-err{border:1px solid var(--color-critical-border);background:var(--color-critical-bg);color:var(--color-critical);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3)}
  .dv-drop{border:2px dashed var(--color-border-strong);border-radius:var(--radius-lg);padding:var(--space-8);text-align:center;background:var(--color-surface)}
  .dv-drop.over{border-color:var(--color-primary);background:var(--color-primary-light)}
  .btn{font:inherit;font-size:var(--text-sm);font-weight:600;border-radius:var(--radius-md);padding:8px 14px;cursor:pointer;border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text)}
  .btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)} .btn:disabled{opacity:.45;cursor:not-allowed}
  .app-nav-group.dv-file{text-transform:none;letter-spacing:0}
  .app-nav-item .cnt{margin-left:auto;font-size:11px;background:var(--color-medium-bg);color:var(--color-medium);border-radius:999px;padding:0 7px}
</style>
</head>
<body class="app-page">
<a href="#app-content" class="skip-link">本文へスキップ</a>
<div class="app-shell">
<aside class="app-sidebar">
  <a href="/systems" class="app-brand"><span class="app-brand-mark">W</span><span class="app-brand-text"><strong>WebSpec2Doc</strong><span>ドキュメント検証</span></span></a>
  <a href="/systems" class="sys-switcher" title="システムを切り替える"><span class="sys-switcher-label">システム</span><span class="sys-switcher-cur">ドキュメント検証</span><span class="sys-switcher-swap">切替</span></a>
  <nav class="app-nav" aria-label="メインナビゲーション">
    <div class="app-nav-group">ドキュメント検証</div>
    <a class="app-nav-item active" href="#" data-nav="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/></svg><span class="nav-label">取り込み</span></a>
    <div class="app-nav-group dv-file" id="dv-nav-file" hidden></div>
    <a class="app-nav-item" href="#" data-nav="inspect" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="nav-label">インスペクション</span><span class="cnt" id="dv-cnt-f"></span></a>
    <a class="app-nav-item" href="#" data-nav="questions" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V14"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg><span class="nav-label">質問票</span><span class="cnt" id="dv-cnt-q"></span></a>
  </nav>
</aside>
<div class="app-main">
  <header class="app-topbar">
    <div class="app-topbar-lead" style="min-width:0">
      <div class="app-breadcrumb"><span>WebSpec2Doc</span><span class="sep">/</span><span>ドキュメント検証</span></div>
      <h1 class="app-topbar-title" id="dv-title">取り込み</h1>
    </div>
  </header>
  <main class="app-content" id="app-content">
    <div class="dv-err" id="dv-err" role="alert" hidden></div>

    <section data-view="upload">
      <form id="dv-form" class="dv-drop">
        <p><strong>検証する仕様書を選んでください</strong></p>
        <p class="mut">Word（.docx）・Excel（.xlsx）・PDF・テキスト（.txt / .md）。20 MB まで。</p>
        <p><input type="file" id="dv-file" accept=".txt,.md,.docx,.xlsx,.pdf"></p>
        <button class="btn btn-primary" type="submit" id="dv-submit">検証する</button>
        <p class="mut" id="dv-busy" hidden>読み取って検証しています…</p>
      </form>
    </section>

    <section data-view="inspect" hidden>
      <div class="dv-doc" id="dv-doc"></div>
      <div id="dv-result"></div>
    </section>

    <section data-view="questions" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)">
        <span class="mut">確度が「要確認」の指摘から作った、文書の作成者への質問です。</span>
        <button class="btn" type="button" id="dv-csv">CSV で書き出す</button>
      </div>
      <div id="dv-qs"></div>
    </section>
  </main>
</div>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const TITLES = {upload: '取り込み', inspect: 'インスペクション', questions: '質問票'};
  let st = null, sel = 0;

  function show(view) {
    document.querySelectorAll('[data-view]').forEach(v => v.hidden = v.dataset.view !== view);
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === view));
    $('#dv-title').textContent = TITLES[view];
  }
  function error(msg) { const e = $('#dv-err'); e.textContent = msg || ''; e.hidden = !msg; }

  function renderInspect() {
    const d = st.document, f = st.findings;
    $('#dv-doc').innerHTML = `<strong>${esc(d.name)}</strong><span class="mut">${esc(d.format.toUpperCase())} ・ ${d.passages} 断片</span><span class="dv-ok">✓ 読み取りました</span>`;
    if (!f.length) {
      $('#dv-result').innerHTML = `<div class="dv-panel"><strong>確認した範囲では指摘はありません。</strong><p class="mut">${st.checked.passages} 断片を、観点「${esc(st.checked.viewpoints.join('・'))}」で確認しました。図の中の文字は確認していません。</p></div>`;
      return;
    }
    const x = f[sel];
    $('#dv-result').innerHTML = `
      <div class="dv-chips"><span class="dv-chip" aria-pressed="true">すべて ${f.length}</span><span class="dv-chip" aria-pressed="false">警告 ${f.length}</span></div>
      <div class="dv-body">
        <table class="dv-t"><thead><tr><th>重大度</th><th>指摘</th><th>場所</th><th>観点</th><th>確度</th></tr></thead><tbody>
        ${f.map((r, i) => `<tr data-i="${i}" class="${i === sel ? 'sel' : ''}"><td><span class="sev">警告</span></td><td>${esc(r.message)}</td><td class="loc">${esc(r.location)}</td><td>${esc(r.viewpoint)}</td><td>${esc(r.certainty)}</td></tr>`).join('')}
        </tbody></table>
        <aside class="dv-side"><span class="sev">警告</span><span class="loc" style="margin-left:8px">${esc(x.location)}</span>
          <h2>${esc(x.message)}</h2><div>根拠（原文）</div><div class="dv-quote">${esc(x.quote)}</div>
          <div><span class="mut">確度</span> <strong>${esc(x.certainty)}</strong>（作成者に確かめる必要があります）</div>
          <div style="margin-top:var(--space-4)"><button class="btn btn-primary" type="button" data-go="questions">質問票を見る</button></div>
        </aside>
      </div>`;
  }
  function renderQuestions() {
    const q = st.questions;
    $('#dv-qs').innerHTML = q.length
      ? `<table class="dv-t"><thead><tr><th>No.</th><th>場所</th><th>質問</th></tr></thead><tbody>${q.map(r => `<tr><td>${esc(r.id)}</td><td class="loc">${esc(r.location)}</td><td>${esc(r.question)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="dv-panel">確かめる必要のある点はありません。</div>';
    $('#dv-csv').disabled = !q.length;
  }

  $('#dv-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const file = $('#dv-file').files[0];
    if (!file) { error('ファイルが選ばれていません。検証する文書を選んでください。'); return; }
    error(''); $('#dv-submit').disabled = true; $('#dv-busy').hidden = false;
    try {
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch('/api/docverify/inspect', {method: 'POST', body: fd});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { error(j.error || 'サーバに接続できませんでした。少し待ってから、もう一度お試しください。'); return; }
      st = j; sel = 0;
      $('#dv-nav-file').textContent = j.document.name; $('#dv-nav-file').hidden = false;
      document.querySelectorAll('[data-nav=inspect],[data-nav=questions]').forEach(a => a.hidden = false);
      $('#dv-cnt-f').textContent = j.findings.length; $('#dv-cnt-q').textContent = j.questions.length;
      renderInspect(); renderQuestions(); show('inspect');
    } catch (e) {
      error('サーバに接続できませんでした。少し待ってから、もう一度お試しください。');
    } finally { $('#dv-submit').disabled = false; $('#dv-busy').hidden = true; }
  });
  const drop = $('#dv-form');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); $('#dv-file').files = e.dataTransfer.files; });
  document.querySelectorAll('[data-nav]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(a.dataset.nav); }));
  $('#dv-result').addEventListener('click', e => {
    if (e.target.closest('[data-go]')) { show('questions'); return; }
    const tr = e.target.closest('tr[data-i]'); if (tr) { sel = +tr.dataset.i; renderInspect(); }
  });
  $('#dv-csv').addEventListener('click', () => {
    const rows = [['No.', '場所', '質問'], ...st.questions.map(q => [q.id, q.location, q.question])];
    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
    a.download = `質問票_${st.document.name}.csv`; a.click(); URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
