    <header class="app-topbar">
      <div class="app-topbar-lead" style="min-width:0">
        <div class="app-breadcrumb" id="topbar-breadcrumb"><span>WebSpec2Doc</span><span class="sep">/</span><span>ホーム</span></div>
        <h1 class="app-topbar-title" id="topbar-title">QAドキュメント生成</h1>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto">
        <div class="app-topbar-actions" id="topbar-actions"></div>
        {% if auth_user %}
        <a href="/auth/account" title="アカウント（{{ auth_user.email }}）"
           style="display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--color-border);border-radius:var(--radius-full);text-decoration:none;color:var(--color-text);font-size:var(--text-sm);background:var(--color-surface)">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--color-primary);color:#fff;font-weight:700;font-size:var(--text-xs)">{{ auth_user.name[:1] | upper }}</span>
          <span>{{ auth_user.name }}</span>
        </a>
        {% endif %}
        <div class="app-topbar-tools">
          <button type="button" id="shortcut-help-btn" class="topbar-icon-btn" title="キーボードショートカット (?)" aria-label="キーボードショートカット一覧を表示">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/></svg>
          </button>
        </div>
      </div>
    </header>
