<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>システム稼働の表示</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>システム稼働の表示</h1><p>サーバーの稼働状況を表示する画面です。10秒ごとに GET /api/health から取得して表示を更新します。</p><p>応答が5秒を超えた場合は取得をやめ、「取得できません」と表示します。「今すぐ更新」ボタンは取得をやり直すだけです。</p><p>表示される「稼働中」「停止中」は監視結果の表示であり、この画面から操作して変えることはできません。</p><table><tr><th>サーバー</th><th>稼働状況</th></tr><tr><td>web-01</td><td>稼働中</td></tr><tr><td>db-01</td><td>停止中</td></tr></table><button type="button">今すぐ更新</button></body></html>
