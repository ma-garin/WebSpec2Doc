<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>表示設定 | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>表示設定</h1>
<section class="spec"><h2>画面の説明</h2><ul><li>言語(日本語・英語)と 1 ページの表示件数(10・50・100)を選べる。</li><li>選んだ内容はこの端末に保存され、次に開いたときも同じ内容で表示される。</li></ul></section>
<section><h2>画面</h2>
<form><label for="l">言語</label><select id="l" name="lang"><option>日本語</option><option>英語</option></select><label for="c">表示件数</label><select id="c" name="per"><option>10</option><option>50</option><option>100</option></select></form>
</section>
</main>
</body></html>
