<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レポート出力</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>レポート出力</h1><p>月次レポートをファイルに出力する画面です。「出力」ボタンを押すと POST /api/reports/export に要求を送ります。</p><p>出力の状態は「待機中」→「出力中」→「完了」または「失敗」と変わります。出力中は「出力」ボタンを押せません。</p><p>60秒たっても完了しない場合は「時間切れです」と表示します。失敗または時間切れのときは「再試行」ボタンが表示され、もう一度出力できます。失敗の理由はメッセージで表示します。</p><p>出力の状態: <strong>待機中</strong></p><button type="button">出力</button> <button type="button">再試行</button><p id="err">（失敗の理由がここに表示されます）</p></body></html>
