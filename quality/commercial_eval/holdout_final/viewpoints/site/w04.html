<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>メモの保存 | あおぞらポータル</title><link rel="stylesheet" href="css/h.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>メモの保存</h1>
<section class="spec"><h2>画面の説明</h2><ul><li>メモは 200 文字まで入力できる。</li><li>「保存」を押すと /api/memo に PUT する。</li><li>保存したメモは、画面を開き直しても表示される。</li></ul></section>
<section><h2>画面</h2>
<form><label for="memo">メモ</label><textarea id="memo" name="memo" maxlength="200" rows="4"></textarea><button type="button" id="go">保存</button></form><p id="msg"></p>
</section>
<script>(function(){var b=document.getElementById("go");if(!b){return;}b.addEventListener("click",function(){fetch("/api/memo",{method:"PUT"}).then(function(r){if(!r.ok){throw new Error("x");}return r.json();}).catch(function(){document.getElementById("msg").textContent="失敗しました";});});})();</script>
</main>
</body></html>
