<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wave2 GUI 案の比較 - WebSpec2Doc</title>
<style>
:root{--bg:#F4F6F9;--sf:#fff;--bd:#E3E8EE;--tx:#212121;--tx2:#616161;--pri:#2563EB;--pri-l:#EFF4FF}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:grid;grid-template-rows:auto 1fr}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--sf);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}.seg button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
iframe{width:100%;height:100%;border:0;background:#fff}small{color:var(--tx2)}
</style></head><body>
<header><b>Wave2 GUI 案の比較</b>
<span>案 <span class="seg" id="opt" role="group" aria-label="案"><button data-v="a-enterprise">A Enterprise QA</button><button data-v="b-modern">B Modern DevTool</button><button data-v="c-hybrid">C Hybrid</button></span></span>
<span>画面 <span class="seg" id="scr" role="group" aria-label="画面"><button data-v="systems">システム選択</button><button data-v="home">指揮ホーム</button><button data-v="ws">System01</button><button data-v="evidence">Evidence</button><button data-v="impact">System09</button></span></span>
<small>本番コードではありません（docs/research/gui-commercial-v2/mockups）</small></header>
<iframe id="f" title="選択中の案と画面"></iframe>
<script>
var st={opt:'c-hybrid',scr:'home'};try{var h=location.hash.slice(1).split('/');if(h[0])st.opt=h[0];if(h[1])st.scr=h[1];}catch(e){}
function draw(){document.getElementById('f').src=st.opt+'.html#'+st.scr;location.replace('#'+st.opt+'/'+st.scr);
['opt','scr'].forEach(function(g){document.querySelectorAll('#'+g+' button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===st[g]));});});}
['opt','scr'].forEach(function(g){document.getElementById(g).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st[g]=b.dataset.v;draw();});});draw();
</script></body></html>
