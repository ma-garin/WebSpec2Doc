{#- 状態: dirty。親に class="ui-state-root" data-state="..." を付け、その直下に include する。文言は UIStates.set の opts で上書きする。 -#}
<section class="ui-state-pane" data-pane="dirty" role="status">
  <p class="ui-state-title">{{ state_title|default('保存していない変更があります') }}</p>

  <p class="ui-state-next">{{ state_next|default('離れる前に「保存」を押してください。') }}</p>
