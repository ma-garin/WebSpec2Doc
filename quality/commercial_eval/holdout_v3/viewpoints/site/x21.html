<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人への応募</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>求人への応募</h1><p>求人に応募するフォームです。氏名とメールアドレスは必須、電話番号は任意で数字10桁または11桁です。</p><p>履歴書はPDFファイルのみ、5MBまでです。PDF以外のファイルや5MBを超えるファイルは拒否し、「ファイルを確認してください」と表示します。志望動機は500文字までです。</p><p>「応募する」を押すと POST /api/applicants にファイルを含めて送信します。</p><form method="post" action="/api/applicants" enctype="multipart/form-data"><p><label>氏名<br><input type="text" name="name" required></label></p><p><label>メールアドレス<br><input type="email" name="email" required></label></p><p><label>電話番号（任意）<br><input type="tel" name="tel" pattern="[0-9]{10,11}"></label></p><p><label>履歴書（PDF・5MBまで）<br><input type="file" name="cv" accept=".pdf"></label></p><p><label>志望動機<br><textarea name="why" maxlength="500"></textarea></label></p><button type="submit">応募する</button></form></body></html>
