<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>パスワード変更</title><style>body{font-family:sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}.n{color:#555;font-size:.9em}button{margin:.4em .3em .4em 0}</style></head><body>
<p><a href="index.html">一覧へ戻る</a></p><h1>パスワード変更</h1>
<p>変更するとサーバに送信されます（POST /api/password）。</p>
<form action="/api/password" method="post">
<label>現在のパスワード ※ <input type="password" required></label>
<label>新しいパスワード ※ <input type="password" required minlength="8" maxlength="32" pattern="(?=.*[A-Za-z])(?=.*[0-9]).+"></label>
<p class="n">8〜32 文字、英字と数字を両方含めてください。</p>
<label>新しいパスワード（確認） ※ <input type="password" required></label>
<p class="n">確認用が一致しない場合は「パスワードが一致しません」を表示します。</p>
<button>変更する</button></form>
</body></html>
