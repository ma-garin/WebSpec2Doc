<div class="dvt-s2">
  <div class="top">
    <h1 data-title>AI が文書を検査しました</h1>
    <p class="lead" data-lead></p>
    <div class="band" data-band>
      <div class="verdict" data-verdict></div>
      <div class="sum" data-sum></div>
      <button class="go" type="button" data-to-report>つながりとレポートへ<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="body">
    <div class="tabs" data-tabs></div>
    <div class="doc" data-doc></div>
    <div class="cards" data-cards></div>
  </div>
  <div class="foot"><button class="redo" type="button" data-redo>登録からやり直す</button></div>
  <div class="dlg" data-dlg hidden>
    <div class="dlg-box" role="dialog" aria-label="誤検知を通報">
      <b>誤検知を通報</b>
      <p>この指摘が正しくない理由を書いてください。</p>
      <textarea rows="3" data-reason placeholder="例: 食い違いではなく、版の違いです"></textarea>
      <p class="err" data-err role="alert">通報の理由を書いてください。</p>
      <div class="dlg-ft"><button type="button" class="plain" data-cancel>やめる</button><button type="button" class="send" data-send>通報する</button></div>
    </div>
  </div>
</div>
