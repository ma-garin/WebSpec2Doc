<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入庫予定リストの編集</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>入庫予定リストの編集</h1><p>入庫予定の品目を画面上のリストで並べ替えたり整理したりする画面です。ボタンは「追加」「削除」「上へ」「下へ」「コピー」「印刷」があります。</p><p>どのボタンも画面上のリストを操作するだけで、リストに状態や段階はありません。リストが空のときは「入庫予定はありません」と表示します。</p><ul id="list"><li>ねじ 500本</li><li>ボルト 300本</li></ul><button type="button">追加</button> <button type="button">削除</button> <button type="button">上へ</button> <button type="button">下へ</button> <button type="button">コピー</button> <button type="button" onclick="window.print()">印刷</button><p id="msg">入庫予定はありません（リストが空のときに表示）</p></body></html>
