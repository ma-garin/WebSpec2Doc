<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APIキーの発行</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>APIキーの発行</h1><p>APIキーを発行する画面で、管理者ロールのみ利用できます。管理者以外には「権限がありません」と表示し、発行ボタンを無効にします。</p><p>キー名は必須で30文字まで、半角英数字とハイフン、アンダースコアのみ使えます。それ以外の文字を含む名前は拒否します。</p><p>発行は POST /api/keys に送ります。同じ名前のキーが既にある場合は「その名前は使われています」と表示して拒否します。送信に失敗した場合は赤字でエラーを表示します。</p><form method="post" action="/api/keys"><p><label>キー名<br><input type="text" name="keyname" required maxlength="30" pattern="[A-Za-z0-9_-]+"></label></p><button type="submit">発行</button></form></body></html>
