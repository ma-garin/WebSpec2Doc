<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在庫数の調整</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>在庫数の調整</h1><p>倉庫の棚卸し結果から在庫数を調整する画面です。数量は0〜9999で、理由の選択は必須です。</p><p>「合計を計算」ボタンを押すと、現在庫と調整数量の合計をこの画面内のスクリプトで計算して表示します。サーバーには送信せず、保存もしません。</p><form onsubmit="return false"><p><label>現在庫<br><input type="number" id="cur" value="120" readonly></label></p><p><label>調整数量<br><input type="number" id="adj" required min="0" max="9999"></label></p><p><label>理由<br><select id="why" required><option value="">選択してください</option><option>破損</option><option>棚卸し差異</option></select></label></p><button type="button" id="calc">合計を計算</button></form><p>合計: <span id="sum">-</span></p><script>document.getElementById('calc').onclick=function(){var a=Number(document.getElementById('adj').value)||0;document.getElementById('sum').textContent=120+a;};</script></body></html>
