<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住民票の写し交付申請</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>住民票の写し交付申請</h1><p>住民票の写しをオンラインで申請します。氏名とメールアドレスは必須、郵便番号は「123-4567」の形式、通数は1〜5通です。形式に合わない値は受け付けず、項目の下にエラーを表示します。</p><p>「申請する」を押すと POST /api/applications に送信します。同じ世帯から同じ日に同じ内容の申請がある場合は「すでに申請済みです」と表示して拒否します。</p><p>応答が30秒を超えた場合は「時間がかかっています」と表示し、「再試行」ボタンで同じ内容を再送できます。</p><form method="post" action="/api/applications"><p><label>氏名<br><input type="text" name="name" required></label></p><p><label>メールアドレス<br><input type="email" name="email" required></label></p><p><label>郵便番号<br><input type="text" name="zip" pattern="[0-9]{3}-[0-9]{4}"></label></p><p><label>通数<br><input type="number" name="copies" required min="1" max="5"></label></p><button type="submit">申請する</button> <button type="button">再試行</button></form></body></html>
