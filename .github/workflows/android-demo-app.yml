# 検証用スマホアプリ SkyBook（demo/android_app）の APK を成果物として出す。
# ubuntu ランナーには Android SDK が同梱されているため、手元に SDK を入れずに APK が取れる。
# 取り出し方: Actions → この workflow の実行 → Artifacts「skybook-debug-apk」→ adb install。
name: Android demo app (SkyBook)

on:
  push:
    paths: ["demo/android_app/**", ".github/workflows/android-demo-app.yml"]
  pull_request:
    paths: ["demo/android_app/**", ".github/workflows/android-demo-app.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo/android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skybook-debug-apk
          path: demo/android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
