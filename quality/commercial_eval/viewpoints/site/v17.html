<p><a href="index.html">一覧へ戻る</a></p><h1>クーポン利用</h1>

<form action="/api/coupons/apply" method="post">
<label>クーポンコード ※ <input type="text" name="code" required pattern="[A-Z0-9]{8}"></label>
