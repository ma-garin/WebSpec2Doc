<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>お問い合わせ | みらい商店</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="hdr"><a href="index.html">メニュー</a></header>
<main>
<h1>お問い合わせ</h1>
<p class="error" role="alert">前回の送信内容を保存できませんでした。もう一度ご入力ください。</p>
<form id="contact" action="#" method="post" novalidate>
<div class="row"><label for="name">お名前</label><input type="text" id="name" name="name" required maxlength="40"></div>
<div class="row"><label for="email">メールアドレス</label><input type="email" id="email" name="email" required maxlength="100"></div>
<div class="row"><label for="subject">お問い合わせ種別</label><select id="subject" name="subject" required><option value="">選択</option><option value="order">ご注文について</option><option value="other">その他</option></select></div>
<div class="row"><label for="body">お問い合わせ内容</label><textarea id="body" name="body" required maxlength="1000" minlength="10" rows="4"></textarea></div>
<div style="display:none"><label for="website">ウェブサイト（スパム対策用・入力しないでください）</label><input type="text" id="website" name="website"></div>
<div class="row"><label><input type="checkbox" id="privacy" name="privacy" required> 個人情報の取り扱いに同意する</label></div>
<div id="contact-errors" aria-live="polite"></div>
<input type="submit" value="送信">
</form>
<iframe src="https://example.com/map" title="店舗地図" width="300" height="200"></iframe>
<a href="p17.html">よくある質問</a>
</main>
<footer><p><small>&copy; 2026 みらい商店 (評価用サンプル)</small></p></footer>
<script>
(function(){var f=document.getElementById("contact");var box=document.getElementById("contact-errors");f.addEventListener("submit",function(ev){ev.preventDefault();var errs=[];if(f.elements["name"].value===''){errs.push("お名前を入力してください");}if(f.elements["body"].value.length<10){errs.push("お問い合わせ内容は10文字以上で入力してください");}box.innerHTML="";errs.forEach(function(m){var q=document.createElement("p");q.className="error";q.textContent=m;box.appendChild(q);});if(!errs.length){fetch("/api/contact",{method:"POST",body:new FormData(f)}).then(function(r){if(!r.ok){throw new Error("http "+r.status);}return r.json();}).catch(function(){var q=document.createElement("p");q.className="error";q.textContent="お問い合わせを送信できませんでした";box.appendChild(q);});}});})();
</script>
</body></html>
