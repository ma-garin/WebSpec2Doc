<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荷物の追跡検索</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>荷物の追跡検索</h1><p>追跡番号を入力して荷物を検索します。追跡番号は空でも検索でき、空のときは直近の荷物を表示します。</p><p>検索は GET /api/shipments?tracking=番号 に問い合わせ、一致する荷物が1件も無い場合は「該当する荷物はありません」と表示します。</p><form method="get" action="/api/shipments"><p><label>追跡番号（任意）<br><input type="text" name="tracking"></label></p><button type="submit">検索</button></form><div id="result"></div></body></html>
