<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ローン返済シミュレーター</title></head><body><p><a href="index.html">一覧へ戻る</a></p><h1>ローン返済シミュレーター</h1><p>借入額・年利・返済年数から毎月の返済額の目安をこの画面の中で計算して表示します。入力値はサーバーへ送らず、保存もしません。</p><p>借入額は10,000円〜50,000,000円、年利は0〜20%で、どちらも必須です。</p><form onsubmit="return false"><p><label>借入額（円）<br><input type="number" id="p" required min="10000" max="50000000"></label></p><p><label>年利（%）<br><input type="number" id="r" required min="0" max="20" step="0.1"></label></p><p><label>返済年数<br><select id="y"><option>10</option><option>20</option><option>35</option></select></label></p><button type="button" id="go">計算</button></form><p>毎月の返済額: <span id="out">-</span></p><script>document.getElementById('go').onclick=function(){var p=Number(document.getElementById('p').value),r=Number(document.getElementById('r').value)/1200,n=Number(document.getElementById('y').value)*12;var m=r?p*r/(1-Math.pow(1+r,-n)):p/n;document.getElementById('out').textContent=Math.round(m);};</script></body></html>
